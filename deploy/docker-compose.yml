# RHG Control Towers. nginx terminates TLS and is the only container with published
# ports; the two apps are reachable only on the internal network.
#
# Memory: the server has 1 GB. mem_limit is what an app may hold in RAM; past that its own idle pages go to swap,
# so one heavy app slows itself instead of freezing the whole host (6 Nov 2026). memswap_limit is RAM + swap: past
# that the app alone is killed and Docker restarts it. Raise these when the server gets more RAM.
# MALLOC_*: glibc gives every thread its own arena and keeps freed memory; these two hand it back to the system.
x-python-memory: &python-memory
  MALLOC_ARENA_MAX: "2"
  MALLOC_TRIM_THRESHOLD_: "65536"

services:
  # Central sign-in, accounts and permissions. The towers hold no accounts:
  # they ask this service who the caller is on every request.
  identity:
    build:
      context: ../rhg-identity
    image: rhg-identity:latest
    restart: unless-stopped
    env_file: ../rhg-identity/.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8767"
      TZ: Europe/Tirane
      <<: *python-memory
    volumes:
      - identity-data:/app/data
    networks: [rhg]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8767/api/session',timeout=5)"]
      # every check starts a whole Python: once a minute, every 5 s only while starting
      interval: 60s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    mem_limit: 128m
    memswap_limit: 384m

  purchasing:
    depends_on: [identity]
    build:
      context: ../rhg-purchasing-local
    image: rhg-purchasing:latest
    restart: unless-stopped
    env_file: ../rhg-purchasing-local/.env
    environment:
      # Must be 0.0.0.0 so nginx can reach it across the container boundary.
      # Not a public exposure: this container publishes no ports to the host.
      APP_HOST: "0.0.0.0"
      APP_PORT: "8765"
      TZ: Europe/Tirane
      <<: *python-memory
      # This tower holds no accounts: it asks identity who the caller is.
      RHG_APP: "purchasing"
      IDENTITY_URL: "http://identity:8767"
      SERVICE_TOKEN: "${SERVICE_TOKEN}"
      COOKIE_NAME: "rhg_session"
    volumes:
      - purchasing-data:/app/data
    networks: [rhg]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/api/session',timeout=5)"]
      # every check starts a whole Python: once a minute, every 5 s only while starting
      interval: 60s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    mem_limit: 300m
    memswap_limit: 800m

  finance:
    depends_on: [identity]
    build:
      context: ../rhg-finance-local
    image: rhg-finance:latest
    restart: unless-stopped
    env_file: ../rhg-finance-local/.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8766"
      TZ: Europe/Tirane
      <<: *python-memory
      # This tower holds no accounts: it asks identity who the caller is.
      RHG_APP: "finance"
      IDENTITY_URL: "http://identity:8767"
      SERVICE_TOKEN: "${SERVICE_TOKEN}"
      COOKIE_NAME: "rhg_session"
    volumes:
      - finance-data:/app/data
      # fiscalization certificate (.p12) for reading the e-invoices: only on the server,
      # outside the code that deploy replaces; read-only for the tower
      - /opt/rhg/secrets:/app/secrets:ro
    networks: [rhg]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8766/api/session',timeout=5)"]
      # every check starts a whole Python: once a minute, every 5 s only while starting
      interval: 60s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    mem_limit: 450m
    memswap_limit: 1200m

  # Scheduled reports: a headless Chromium that opens screens as the people who receive them (short read-only
  # sessions from identity) and emails a picture and a PDF through the Purchasing mail server. No ports, no data.
  # Its code lives in rhg-identity/reporter: the deploy copies only the three app folders to the server.
  # It waits for identity and nginx on its own (it asks again every minute until they answer).
  # Profile "reports": a plain "docker compose up" on the server leaves it alone. Like the other images it is built
  # on the GitHub runner and loaded onto the server only when its folder changed; see README-DEPLOY.md.
  # mem_limit stays below the server's RAM, so a heavy page kills Chromium here and not one of the towers.
  reporter:
    profiles: ["reports"]
    build:
      context: ../rhg-identity/reporter
    image: rhg-reporter:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Tirane
      IDENTITY_URL: "http://identity:8767"
      SITE_URL: "http://nginx"
      PURCHASING_URL: "http://purchasing:8765"
      SERVICE_TOKEN: "${SERVICE_TOKEN}"
      COOKIE_NAME: "rhg_session"
    mem_limit: 700m
    shm_size: 256m
    networks: [rhg]

  # Internal router: keeps the /finance and /purchasing path rewriting
  # (sub_filter + cookie scoping) that NPM's GUI cannot express.
  # NPM publishes 80/443 and forwards to this on port 80.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [purchasing, finance]
    networks: [rhg]

  # Nginx Proxy Manager: the GUI that owns 80/443 and, later, Let's Encrypt.
  npm:
    image: jc21/nginx-proxy-manager:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"     # admin GUI
    environment:
      DISABLE_IPV6: "true"
      TZ: Europe/Tirane
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on: [nginx]
    networks: [rhg]

volumes:
  purchasing-data:
  finance-data:
  identity-data:
  npm-data:
  npm-letsencrypt:

networks:
  rhg:
