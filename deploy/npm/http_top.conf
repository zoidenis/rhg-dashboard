# Catch-all TLS server: NPM matches hosts by SNI/server_name, and a bare IP
# request does not match a domain host, so the handshake is rejected with
# "unrecognized name". This default_server accepts any SNI and forwards to
# the internal router, which keeps the /finance and /purchasing rewriting.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /data/custom_ssl/npm-1/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/npm-1/privkey.pem;

    location / {
        proxy_pass http://nginx;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
}
