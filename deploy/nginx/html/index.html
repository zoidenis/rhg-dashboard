<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RHG Control Towers</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Revo / RHG brand layer - same palette and type as the two control towers.
   #0c475e deep blue - #a0d8ea sky - #ecebeb light grey */
:root{--bg:#ecebeb;--card:#fff;--ink:#0e2733;--sub:#5c7482;--line:#d9dcdd;
      --accent:#0c475e;--sky:#a0d8ea;--sky-soft:#e4f3f9;
      --mark:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 70"><path d="M0 0V22.6109L22.6078 34.6779V0H0Z"/><path d="M22.6078 34.6905V34.678L0 46.7481V69.3559H22.6078V34.6905Z"/><path d="M22.6079 34.6904L46.3518 0H62.1177V34.6779L22.6079 34.6904Z"/></svg>')}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;
  letter-spacing:-.005em}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.panel{width:100%;max-width:520px}
.brand{display:flex;gap:11px;align-items:center;margin-bottom:22px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--sky);color:var(--accent);
  display:grid;place-items:center}
/* Revo mark as a mask, so it takes the tile colour in both themes. */
.logo::after{content:"";width:56%;height:56%;background-color:currentColor;
  -webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
h1{font-size:17px;margin:0;letter-spacing:-.02em}
small{color:var(--sub)}
.towers{display:grid;gap:12px}
a.tower{display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
a.tower:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(12,71,94,.10);transform:translateY(-1px)}
a.tower:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{width:38px;height:38px;flex:none;border-radius:10px;background:var(--sky-soft);
  color:var(--accent);display:grid;place-items:center}
.mark svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.t-name{font-weight:700;font-size:15px}
.t-desc{color:var(--sub);font-size:12.5px;margin-top:2px}
.chev{margin-left:auto;color:var(--sub)}
a.tower:hover .chev{color:var(--accent)}
.note{margin-top:20px;font-size:12px;color:var(--sub);line-height:1.5}
@media (prefers-color-scheme:dark){
  :root{--bg:#08222d;--card:#0e2f3d;--ink:#e8f2f6;--sub:#93b2bf;--line:#194354;
        --accent:#a0d8ea;--sky-soft:rgba(160,216,234,.14)}
  .logo{background:var(--sky);color:#08303f}
  a.tower:hover{box-shadow:0 6px 18px rgba(0,0,0,.30)}
}
</style>
</head>
<body>
<div class="wrap"><div class="panel">
  <div class="brand">
    <div class="logo"></div>
    <div><h1>RHG Control Towers</h1><small>Revo Hospitality Group</small></div>
  </div>
  <div class="towers">
    <a class="tower" href="/finance/">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V10M12 20V4M18 20v-7"/></svg></div>
      <div>
        <div class="t-name">Finance &amp; Inventory</div>
        <div class="t-desc">P&amp;L, balance sheet, AP/AR, cash, treasury and stock</div>
      </div>
      <div class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
    </a>
    <a class="tower" href="/purchasing/">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg></div>
      <div>
        <div class="t-name">Purchasing</div>
        <div class="t-desc">Spend, suppliers, price movements and requisitions</div>
      </div>
      <div class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
    </a>
  </div>
  <div class="note">Business Central is read-only. Sessions last 12 hours;
    five wrong attempts lock the account for 15 minutes.</div>
</div></div>
</body>
</html>
