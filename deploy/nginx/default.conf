# RHG Control Towers - internal path router, behind Nginx Proxy Manager.
# NPM owns 80/443 and TLS; this layer owns the path rewriting NPM cannot express.
#
# Both apps emit root-absolute paths ("/api/...", "/brand.css", location.href="/login").
# Under a /finance or /purchasing prefix those would escape the prefix, so nginx strips
# the prefix upstream and rewrites the paths back into the prefix on the way down
# (sub_filter). No application code is modified.

# Docker's embedded DNS server. Without this, nginx resolves the upstream names
# once at startup and keeps the IPs forever - if an app container restarts and
# gets a different IP, every request 502s until nginx is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP behind Nginx Proxy Manager, which terminates TLS on 443.
server {
    listen 80;
    server_name _;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20m;

    # The identity service is the front door: sign-in, the app chooser and
    # administration all live at the root. It replaces the old static landing page.
    location / {
        set $up_identity identity;
        proxy_pass http://$up_identity:8767$uri$is_args$args;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;

        # The identity cookie is issued for the whole site, so both towers see it.
        proxy_cookie_path / "/; Secure";
    }

    # ---------------------------------------------------------------- finance
    location = /finance  { return 301 /finance/; }

    location /finance/ {
        set $up_finance finance;
        # $uri still carries /finance/, so strip it before it goes upstream.
        rewrite ^/finance/?(.*)$ /$1 break;
        proxy_pass http://$up_finance:8766$uri$is_args$args;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;   # BC OData queries over 207 accounts are slow

        # Keep the app's Set-Cookie inside this prefix and mark it Secure,
        # since the app itself sets neither Path=/finance nor Secure.
        proxy_cookie_path  /  "/finance/; Secure";
        # The tower now redirects to "/" to mean the central sign-in at the site
        # root, so that one must pass through untouched. Everything else it sends
        # is still relative to its own prefix.
        proxy_redirect     ~^/$  https://$host/;
        proxy_redirect     /     /finance/;

        # Rewrite root-absolute references in the served text.
        sub_filter_once  off;
        sub_filter_types text/css application/javascript;   # text/html is always included
        sub_filter '"/api/'        '"/finance/api/';
        sub_filter '`/api/'        '`/finance/api/';
        sub_filter "'/api/"        "'/finance/api/";
        sub_filter '"/brand.css"'  '"/finance/brand.css"';
        sub_filter '"/logo.svg"'   '"/finance/logo.svg"';
        sub_filter '"/logo.png"'   '"/finance/logo.png"';
        sub_filter '"/login"'      '"/finance/login"';
        sub_filter "'/login'"      "'/finance/login'";
        sub_filter 'location.href = "/"'  'location.href = "/finance/"';
        sub_filter 'location.href="/"'    'location.href="/finance/"';
    }

    # ------------------------------------------------------------- purchasing
    location = /purchasing { return 301 /purchasing/; }

    location /purchasing/ {
        set $up_purchasing purchasing;
        rewrite ^/purchasing/?(.*)$ /$1 break;
        proxy_pass http://$up_purchasing:8765$uri$is_args$args;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;

        proxy_cookie_path  /  "/purchasing/; Secure";
        # "/" means the central sign-in at the site root, so it passes through.
        proxy_redirect     ~^/$  https://$host/;
        proxy_redirect     /     /purchasing/;

        sub_filter_once  off;
        sub_filter_types text/css application/javascript;   # text/html is always included
        sub_filter '"/api/'        '"/purchasing/api/';
        sub_filter '`/api/'        '`/purchasing/api/';
        sub_filter "'/api/"        "'/purchasing/api/";
        sub_filter '"/brand.css"'  '"/purchasing/brand.css"';
        sub_filter '"/logo.svg"'   '"/purchasing/logo.svg"';
        sub_filter '"/logo.png"'   '"/purchasing/logo.png"';
        sub_filter '"/login"'      '"/purchasing/login"';
        sub_filter "'/login'"      "'/purchasing/login'";
        sub_filter 'location.href = "/"'  'location.href="/purchasing/"';
        sub_filter 'location.href="/"'    'location.href="/purchasing/"';
    }
}
