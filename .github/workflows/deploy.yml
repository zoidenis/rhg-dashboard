name: Deploy

# Çdo push në main shkon drejt e në server. Deploy-i mund të nisë edhe me dorë
# nga skeda Actions (workflow_dispatch), p.sh. për të ribërë një deploy të dështuar.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dy deploy-e njëkohësisht do të përplaseshin mbi të njëjtin docker compose.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Kontroll — asnjë .env në commit
        run: |
          # Roje: nëse një .env rihyn ndonjëherë në repo, deploy-i ndalet këtu
          # në vend që t'i shpërndajë kredencialet.
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::Një .env është i gjurmuar në git. Hiqe para deploy-it."
            exit 1
          fi
          echo "OK — asnjë .env i gjurmuar."

      - name: Kontroll sintakse Python
        run: |
          for app in rhg-finance-local rhg-purchasing-local rhg-identity; do
            python3 -m compileall -q "$app" || exit 1
          done
          echo "OK — sintaksa e pastër."

      - name: Përgatit çelësin SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER: ${{ secrets.SERVER_SSH }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # OpenSSH e refuzon nje celes qe nuk mbaron me newline ("error in
          # libcrypto", exit 255), dhe GitHub Secrets e heq shpesh ate te fundit.
          # printf '%s\n' e rivendos pa shtuar nje te dyte kur ekziston.
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Deshto ketu, me nje mesazh te qarte, ne vend qe te dale nje 255 i zhveshur
          # nga hapi tjeter.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY nuk eshte celes i vlefshem. Kopjoje te plote, perfshi rreshtat BEGIN/END."
            exit 1
          fi
          if [ -z "$SERVER" ]; then
            echo "::error::Mungon secret-i SERVER_SSH (pritet 'root@139.162.169.104')."
            exit 1
          fi
          case "$SERVER" in
            *@*) : ;;
            *) echo "::error::SERVER_SSH duhet te jete 'user@host', jo '$SERVER'."; exit 1 ;;
          esac

          host="${SERVER#*@}"

          # Nje known_hosts bosh ose per host tjeter e ndal lidhjen me nje 255 te
          # heshtur, prandaj kontrollohet para se te provohet.
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::SERVER_KNOWN_HOSTS eshte bosh. Vendose rreshtin qe jep: ssh-keyscan $host"
            exit 1
          fi
          if ! grep -q "$host" ~/.ssh/known_hosts; then
            echo "::error::SERVER_KNOWN_HOSTS nuk permban '$host'. Vendos daljen e: ssh-keyscan $host"
            sed -e 's/AAAA[A-Za-z0-9+/=]*/<celesi>/g' ~/.ssh/known_hosts
            exit 1
          fi

          # Provo lidhjen njehere, qe nje problem i qasjes te duket ketu dhe jo dy
          # hapa me vone si nje 255 pa shpjegim.
          if ! ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
                   -i ~/.ssh/id_ed25519 "$SERVER" 'echo "SSH OK: $(hostname)"'; then
            echo "::error::Lidhja SSH deshtoi. Diagnostikimi me poshte."
            echo "--- a arrihet porta 22?"
            timeout 10 bash -c "cat < /dev/null > /dev/tcp/$host/22" \
              && echo "porta 22: e hapur" || echo "porta 22: e paarritshme"
            echo "--- cfare thote ssh me -v (pa sekrete)"
            ssh -vv -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
                -i ~/.ssh/id_ed25519 "$SERVER" true 2>&1 \
              | grep -iE 'debug1|host key|permission|denied|authenticat|no matching|refused|timed out' \
              | head -25
            echo "--- a e pranon serveri kete celes publik?"
            ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, substr($2,1,24) "..."}'
            exit 1
          fi

      - name: Sinkronizo kodin
        env:
          SERVER: ${{ secrets.SERVER_SSH }}
        run: |
          # .env, data/ dhe certs/ rrijnë vetëm në server dhe nuk preken kurrë.
          EXCL="--exclude=.git --exclude=.github --exclude=.venv \
                --exclude=__pycache__ --exclude=*.pyc --exclude=.env \
                --exclude=.DS_Store --exclude=data"
          SSH_OPTS='-o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519'
          for app in rhg-finance-local rhg-purchasing-local rhg-identity; do
            echo "==> $app"
            rsync -az --delete -e "ssh $SSH_OPTS" $EXCL "$app/" "$SERVER:/opt/rhg/$app/"
          done

          echo "==> deploy files"
          ssh $SSH_OPTS "$SERVER" 'mkdir -p /opt/rhg/deploy/nginx/html /opt/rhg/deploy/npm'
          # certs/ përjashtohet: certifikatat janë të serverit, jo të repo-s.
          rsync -az --delete -e "ssh $SSH_OPTS" --exclude=certs --exclude=.env \
                deploy/ "$SERVER:/opt/rhg/deploy/"
          ssh $SSH_OPTS "$SERVER" 'chmod +x /opt/rhg/deploy/*.sh'

      # Imazhet NUK ndertohen ne server (1 CPU / 1 GB): ndertimi atje e la pa memorie dhe e
      # nderpreu deploy-in me 5 nentor. Ndertohen ketu dhe dergohen me docker save | docker load,
      # vetem ato qe ndryshuan (etiketa rhg.tree mban hash-in e dosjes ne git). Keshtu nje aplikacion
      # qe nuk ndryshoi mban imazhin e vet dhe nuk rindizet.
      - name: Ndërto imazhet në runner dhe dërgoji
        env:
          SERVER: ${{ secrets.SERVER_SSH }}
        run: |
          SSH="ssh -o BatchMode=yes -o IdentitiesOnly=yes -i $HOME/.ssh/id_ed25519"
          changed=""
          for pair in rhg-finance-local:rhg-finance rhg-purchasing-local:rhg-purchasing rhg-identity:rhg-identity; do
            dir="${pair%%:*}"; img="${pair##*:}"
            tree=$(git rev-parse "HEAD:$dir")
            if $SSH "$SERVER" "docker image inspect -f '{{json .Config.Labels}}' $img:latest 2>/dev/null" \
                 | grep -q "$tree"; then
              echo "$img: pa ndryshim ($tree)"
            else
              echo "==> Ndertoj $img ($tree)"
              docker build --label "rhg.tree=$tree" -t "$img:latest" "$dir"
              changed="$changed $img:latest"
            fi
          done
          if [ -n "$changed" ]; then
            echo "==> Dergoj ne server:$changed"
            docker save $changed | gzip -1 | $SSH "$SERVER" 'docker load'
          fi

      - name: Rinis
        env:
          SERVER: ${{ secrets.SERVER_SSH }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$SERVER" 'set -e
            cd /opt/rhg/deploy

            # Nje rikrijim i nderprere i compose-it le pas nje kontejner "<id>_deploy-<sherbimi>-1"
            # ne gjendjen Created; rikrijimi tjeter perplaset me emrin ("name already in use") dhe
            # sherbimi mbetet i ndalur (identity ra keshtu me 4 nentor). Hiqen para dhe pas.
            cleanup() {
              docker ps -a --format "{{.ID}} {{.Names}}" \
                | awk "\$2 ~ /^[0-9a-f]{12}_deploy-/ {print \$1}" \
                | xargs -r docker rm -f
            }
            cleanup
            # Pa --force-recreate: compose rikrijon vetem kontejneret, imazhi i te cileve ndryshoi.
            if ! docker compose up -d --no-build finance purchasing identity; then
              echo "::warning::up deshtoi; pastrohen mbetjet dhe provohet edhe nje here"
              cleanup
              sleep 3
              docker compose up -d --no-build finance purchasing identity
            fi
            docker image prune -f >/dev/null 2>&1 || true'

      - name: Prit health-check-et
        env:
          SERVER: ${{ secrets.SERVER_SSH }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$SERVER" 'cd /opt/rhg/deploy
            for i in $(seq 1 30); do
              s=$(docker compose ps --format "{{.Service}}:{{.Status}}")
              echo "$s" | grep -q "starting" || break
              sleep 5
            done
            docker compose ps --format "{{.Service}}: {{.Status}}"
            # Çdo shërbim me health-check duhet të jetë healthy.
            for svc in finance purchasing identity; do
              docker compose ps --format "{{.Service}}:{{.Status}}" \
                | grep -q "^$svc:Up.*healthy" || {
                  echo "::error::$svc nuk eshte healthy"
                  docker compose logs --tail=40 "$svc"
                  exit 1
                }
            done'

      - name: Verifiko që faqja përgjigjet
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER: ${{ secrets.SERVER_SSH }}
        run: |
          # Nje SERVER_HOST bosh e ben url-ne "https:///", te cilen curl e refuzon
          # me exit 3 - nje deshtim qe duket si i deploy-it edhe pse deploy-i ka
          # mbaruar. Kur mungon, host-i merret nga SERVER_SSH.
          host="${SERVER_HOST:-${SERVER#*@}}"
          host="${host#http://}"; host="${host#https://}"; host="${host%%/*}"
          if [ -z "$host" ]; then
            echo "::warning::As SERVER_HOST as SERVER_SSH nuk japin nje host; verifikimi u kapercye."
            exit 0
          fi

          echo "Po verifikoj https://$host/"
          code=$(curl -sk -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 \
                 "https://$host/") || {
            echo "::error::curl deshtoi per https://$host/ (kontrollo secret-in SERVER_HOST)"
            exit 1
          }
          echo "Rrënja ktheu $code"
          [ "$code" = "200" ] || { echo "::error::Pritej 200, erdhi $code"; exit 1; }

      # Raportet e planifikuara. Imazhi (Chromium, ~400 MB), si te tjeret, ndertohet ketu ne
      # runner dhe dergohet me docker save | docker load, vetem kur kodi i
      # rhg-identity/reporter ndryshon (etiketa rhg.tree mban hash-in e dosjes ne git).
      # Ne cdo deploy tjeter vetem sigurohet qe reporter-i te jete ndezur.
      # Vjen pas verifikimit te faqes: nese deshton, faqja eshte tashme lart.
      - name: Reporter (raportet me email)
        env:
          SERVER: ${{ secrets.SERVER_SSH }}
        run: |
          SSH="ssh -o BatchMode=yes -o IdentitiesOnly=yes -i $HOME/.ssh/id_ed25519"
          tree=$(git rev-parse HEAD:rhg-identity/reporter)
          recreate=""
          if $SSH "$SERVER" "docker image inspect -f '{{json .Config.Labels}}' rhg-reporter:latest 2>/dev/null" \
               | grep -q "$tree"; then
            echo "Kodi i reporter-it nuk ndryshoi ($tree): imazhi ne server mbetet."
          else
            echo "==> Ndertoj rhg-reporter ne runner ($tree)"
            docker build --label "rhg.tree=$tree" -t rhg-reporter:latest rhg-identity/reporter
            docker image ls rhg-reporter:latest
            echo "==> Dergoj imazhin ne server"
            docker save rhg-reporter:latest | gzip -1 | $SSH "$SERVER" 'docker load'
            recreate="--force-recreate"
          fi

          $SSH "$SERVER" "set -e
            cd /opt/rhg/deploy
            docker compose --profile reports up -d --no-build $recreate reporter
            sleep 10
            docker compose --profile reports ps reporter --format '{{.Service}}: {{.Status}}'
            docker compose --profile reports ps reporter --format '{{.Status}}' | grep -q '^Up' || {
              echo '::error::reporter nuk eshte ndezur'
              docker compose --profile reports logs --tail=40 reporter
              exit 1
            }
            docker compose --profile reports logs --tail=5 reporter
            docker image prune -f >/dev/null 2>&1 || true"
