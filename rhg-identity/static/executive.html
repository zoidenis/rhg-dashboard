<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08303f">
<title>RHG Executive Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
button,select,input{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
main{flex:1;min-width:0}
header{display:flex;justify-content:space-between}
.adminlink{margin-top:auto;padding-top:16px}
.adminlink a{color:var(--rhg-blue);font-size:11px;text-decoration:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);display:inline-block}
.pill.err .dot{background:var(--up)} .pill.load .dot{background:var(--warn)}

/* chart tokens: validated two-series pair (actual, comparison) and a four-slot split */
:root{--c1:#1e78a6;--c2:#c47f1f;--c3:#7a5bbf;--c4:#2e9a6e;--grid:#e6e8e9;--axis:#5c7482;--hl:rgba(30,120,166,.07)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--c1:#3a95c6;--c2:#c4832a;--c3:#9479d6;--c4:#3aa87a;--grid:#194354;--axis:#93b2bf;--hl:rgba(58,149,198,.12)}
}
:root[data-theme="dark"]{--c1:#3a95c6;--c2:#c4832a;--c3:#9479d6;--c4:#3aa87a;--grid:#194354;--axis:#93b2bf;--hl:rgba(58,149,198,.12)}

.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:-8px 0 12px}
.filters label{flex:1 1 150px;padding-left:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;
  color:var(--rhg-primary);background:var(--card);border:1px solid var(--line)}
.tabs button:hover{border-color:var(--rhg-primary)}
.tabs button.on{background:var(--rhg-primary);color:#fff;border-color:var(--rhg-primary)}
@media (prefers-color-scheme: dark){.tabs button{color:var(--ink)}.tabs button.on{background:#1e78a6;border-color:#1e78a6}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:4px}
.dl{font-weight:600;white-space:nowrap}
.dl.good{color:var(--rhg-green)} .dl.bad{color:var(--rhg-red)} .dl.flat{color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid2 > .card{min-width:0}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.card{margin-bottom:16px}
.grid2 .card{margin-bottom:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chead h2{font-size:15px}
.chead .hint{margin:4px 0 0}
.tgl{all:unset;cursor:pointer;font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
.tgl:hover{text-decoration:underline}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:10px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:2px;border-radius:1px;vertical-align:3px;width:14px}
.chart{position:relative;width:100%;margin-top:6px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--rhg-font);font-size:11px;fill:var(--axis)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1;opacity:.6}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover,.chart .hit.on{fill:var(--hl)}
.chart .sel{fill:var(--hl)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.12);display:none;min-width:150px}
#tip b{display:block;margin-bottom:2px}
#tip .r{display:flex;justify-content:space-between;gap:14px}
#tip .r span:first-child{color:var(--sub)}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.scroll{overflow-x:auto}
td.num,th.num{font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--rhg-sky)}
tr.sel td{background:var(--rhg-sky)}
td.mut{color:var(--sub)}
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin-bottom:16px;font-size:12px}
.banner .bar{flex:0 0 160px;height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.banner .bar i{display:block;height:100%;background:var(--c1);width:0}
.banner.warn{border-color:var(--rhg-amber)}
.note{font-size:11px;color:var(--sub);line-height:1.5;margin:8px 0 0}
.empty{color:var(--sub);padding:14px 0}
.prov{color:var(--rhg-amber);font-weight:600}
.defs{font-size:11px;color:var(--sub);line-height:1.6}
.defs b{color:var(--ink);font-weight:600}
@media(max-width:760px){aside{display:none} main{padding:16px} header{flex-direction:column} .hdr-side{align-items:flex-start}
  .kpis{grid-template-columns:1fr 1fr}}
</style>
<link rel="stylesheet" href="/brand.css">
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo" role="img" aria-label="Revo Hospitality Group"></div><div><b>Revo</b><small>Hospitality Group</small></div></div>
  <div class="towers" aria-label="Control towers" id="towers">
    <span class="lbl">Control towers</span>
    <a href="/">Control center</a>
    <a href="/executive" class="on" aria-current="page">Executive dashboard</a>
  </div>
  <div class="adminlink" id="adminLink"></div>
</aside>

<main>
  <header>
    <div>
      <div class="eyebrow">RHG Control towers / Business Central and Simphony, read-only</div>
      <h1>Executive dashboard</h1>
      <div class="period" id="periodLabel">Reading…</div>
    </div>
    <div class="hdr-side">
      <div class="hdr-btns"><button class="btn dark" id="refreshBtn">Refresh now</button></div>
      <div class="hdr-meta">
        <span class="pill load" id="pill"><span class="dot"></span><span id="pillText">Reading…</span></span>
        <span class="sep">|</span><span id="whoami"></span>
        <button class="linkbtn" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <label>Company <select id="fCompany"></select></label>
    <label>Year <select id="fYear"></select></label>
    <label>Period <select id="fMode">
      <option value="month">Month</option><option value="quarter">Quarter to date</option>
      <option value="ytd">Year to date</option></select></label>
    <label>Up to <select id="fEnd"></select></label>
    <label>Restaurant <select id="fDept"><option value="*">Whole company</option></select></label>
    <label>Compare with <select id="fCompare">
      <option value="ly">Last year</option><option value="budget">Budget</option>
      <option value="prior">Period before</option></select></label>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button data-tab="overview" class="on">Executive KPIs</button>
    <button data-tab="sales">Sales</button>
    <button data-tab="labor">Labour cost</button>
    <button data-tab="food">Food cost</button>
    <button data-tab="budget">Budget</button>
    <button data-tab="purchasing">Purchasing</button>
  </div>

  <div id="banner"></div>
  <div id="view"></div>
  <p class="note" id="foot"></p>
</main>
</div>
<div id="tip" role="tooltip"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=0) => n == null || !isFinite(n) ? "–" : Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const compact = v => { if (v == null || !isFinite(v)) return "–"; const a = Math.abs(v);
  return a >= 1e9 ? (v/1e9).toFixed(2)+"B" : a >= 1e6 ? (v/1e6).toFixed(1)+"M" : a >= 1e4 ? (v/1e3).toFixed(0)+"K" : fmt(v,0); };
const pct = (v, d=1) => v == null || !isFinite(v) ? "–" : fmt(v, d) + "%";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mlabel = k => { const [y,m] = k.split("-"); return MON[+m-1] + " " + y; };
const mshort = k => MON[+k.split("-")[1]-1];
let me = null, CSRF = null;
const can = p => !!me && (me.permissions||[]).includes(p);

const S = {fin: null, pur: null, finErr: null, purErr: null, timer: null};
const F = {company: "", year: new Date().getFullYear(), mode: "month", end: "", dept: "*", compare: "ly", tab: "overview"};

async function get(path){
  const r = await fetch(path, {credentials: "same-origin"});
  if (r.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  const t = await r.text(); let j = {};
  try { j = JSON.parse(t); } catch (e) {
    throw new Error(r.status === 504 || r.status === 502 ? "The server took too long to answer; it keeps reading, try again in a minute." : "HTTP " + r.status);
  }
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* ------------------------------------------------------------ periods */
const shift = (k, n) => { let [y,m] = k.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  return `${y}-${String(m).padStart(2,"0")}`; };
function rangeKeys(){
  if (!F.end) return [];
  const m = +F.end.split("-")[1];
  const start = F.mode === "ytd" ? 1 : F.mode === "quarter" ? Math.floor((m-1)/3)*3+1 : m;
  const out = []; for (let i = start; i <= m; i++) out.push(`${F.year}-${String(i).padStart(2,"0")}`);
  return out;
}
const running = () => (S.fin && S.fin.running) || null;
function compKeys(keys, how){
  const run = running();
  if (how === "ly") return keys.map(k => run && k === run.month ? run.ly : shift(k, -12));
  if (how === "prior") return keys.map(k => keys.length === 1 && run && k === run.month ? run.prior : shift(k, -keys.length));
  return keys;
}
const compName = how => ({ly: "last year", prior: "the period before", budget: "budget"})[how];
function periodText(keys){
  if (!keys.length) return "";
  const run = running(); const last = keys[keys.length-1];
  const tail = run && last === run.month ? ` (to ${new Date(run.to+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})})` : "";
  return keys.length === 1 ? mlabel(keys[0]) + tail : `${mshort(keys[0])} – ${mlabel(last)}${tail}`;
}

/* ------------------------------------------------------------ figures */
const BUCKETS = ["sales","other_income","food","labor_kitchen","labor_service","labor_management","labor_other","opex","da","below"];
function bucketOf(no){
  const a = S.fin && S.fin.accounts[no];
  return a ? a[1] : (String(no).startsWith("7") ? "other_income" : "opex");
}
function derive(t){
  t.labor = t.labor_kitchen + t.labor_service + t.labor_management + t.labor_other;
  t.prime = t.food + t.labor;
  t.ebitda = t.sales + t.other_income - t.food - t.labor - t.opex;
  t.ebit = t.ebitda - t.da; t.net = t.ebit - t.below;
  const r = v => t.sales ? v / t.sales * 100 : null;
  t.foodPct = r(t.food); t.laborPct = r(t.labor); t.primePct = r(t.prime); t.ebitdaPct = r(t.ebitda); t.opexPct = r(t.opex);
  return t;
}
function blank(){ const t = {acc: {}, n: 0, missing: 0}; BUCKETS.forEach(b => t[b] = 0); return t; }
/* sum of cells: src[dept][key] = {account: value}; scale: optional {key: factor} */
function agg(src, dept, keys, scale){
  const t = blank();
  for (const k of keys){
    const c = src && src[dept] && src[dept][k];
    if (!c) { t.missing++; continue; }
    t.n++; const f = scale && scale[k] != null ? scale[k] : 1;
    for (const no in c){ const v = c[no] * f; t[bucketOf(no)] += v; t.acc[no] = (t.acc[no]||0) + v; }
  }
  return derive(t);
}
function budgetScale(keys){
  const run = running(), sc = {};
  if (run && keys.includes(run.month)){
    const [y,m] = run.month.split("-").map(Number), days = new Date(y, m, 0).getDate();
    sc[run.month] = (new Date(run.to+"T00:00:00").getDate()) / days;
  }
  return sc;
}
function actual(dept, keys){ return agg(S.fin && S.fin.actual, dept, keys); }
function comparison(dept, keys, how){
  how = how || F.compare;
  if (how === "budget") return S.fin && S.fin.budget && S.fin.budget.available ? agg(S.fin.budget.cells, dept, keys, budgetScale(keys)) : null;
  return agg(S.fin && S.fin.actual, dept, compKeys(keys, how));
}
function unassigned(keys, src, scale){
  const all = agg(src, "*", keys, scale), t = blank();
  BUCKETS.forEach(b => t[b] = all[b]);
  for (const d of depts()) { const x = agg(src, d.code, keys, scale); BUCKETS.forEach(b => t[b] -= x[b]); }
  t.n = all.n; return derive(t);
}
const depts = () => (S.fin && S.fin.departments) || [];
const deptName = c => c === "*" ? "Whole company" : c === "" ? "Not on a restaurant" : ((depts().find(d => d.code === c) || {}).name || c);

/* change against comparison; for costs and ratios a rise is bad */
function delta(cur, cmp, kind){
  if (cur == null || cmp == null || !isFinite(cur) || !isFinite(cmp)) return null;
  if (kind === "pts") { const d = cur - cmp; return {v: d, txt: (d >= 0 ? "+" : "") + fmt(d,1) + " pts"}; }
  if (!cmp) return null;
  const d = (cur - cmp) / Math.abs(cmp) * 100; return {v: d, txt: (d >= 0 ? "+" : "") + fmt(d,1) + "%"};
}
function dl(d, goodWhenUp, label){
  if (!d) return label ? `<span class="dl flat">no comparison</span>` : `<span class="mut">–</span>`;
  const flat = Math.abs(d.v) < 0.05, good = flat ? null : (d.v > 0) === goodWhenUp;
  const cls = flat ? "flat" : good ? "good" : "bad", arrow = flat ? "→" : d.v > 0 ? "▲" : "▼";
  return `<span class="dl ${cls}" title="${good === null ? "Unchanged" : good ? "Better" : "Worse"}">${arrow} ${esc(d.txt)}</span>${label ? ` <span class="meta">${esc(label)}</span>` : ""}`;
}
function tile(label, value, unit, sub, dlt){
  return `<div class="card kpi"><div class="l">${esc(label)}</div><div class="v">${value}${unit ? `<small>${esc(unit)}</small>` : ""}</div>
    <div class="s">${dlt || ""}${sub ? `<div class="meta">${sub}</div>` : ""}</div></div>`;
}

/* ------------------------------------------------------------ charts */
const tip = $("tip");
function showTip(ev, title, rows){
  tip.innerHTML = `<b>${esc(title)}</b>` + rows.map(r => `<div class="r"><span>${r.c ? `<i style="background:${r.c}"></i>` : ""}${esc(r.k)}</span><span>${esc(r.v)}</span></div>`).join("");
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceStep(v){ if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function scaleOf(vals){
  const mx = Math.max(0, ...vals), mn = Math.min(0, ...vals), step = niceStep((mx - mn) / 4);
  const lo = Math.floor(mn / step) * step, hi = Math.max(step, Math.ceil(mx / step) * step);
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  return {lo, hi, ticks};
}
function legendHTML(series){
  if (series.length < 2) return "";
  return `<div class="legend">${series.map(s => `<span><i class="${s.line ? "line" : ""}" style="background:${cssVar(s.color)}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}
/* spec: {type:"vbar"|"hbar"|"line"|"stack", cats:[{key,label,hl}], series:[{name,color,values,line}], fmt, tipFmt, onClick} */
const CHARTS = new Map();
function drawChart(host, spec){
  CHARTS.set(host.id, spec);
  if (host.dataset.table === "1") return drawTable(host, spec);
  const W = Math.max(280, host.clientWidth || 600);
  const vf = spec.fmt || compact, tf = spec.tipFmt || (v => fmt(v,0));
  host.innerHTML = legendHTML(spec.series);
  const cats = spec.cats, series = spec.series;
  if (!cats.length) { host.insertAdjacentHTML("beforeend", `<div class="empty">Nothing to show for this selection.</div>`); return; }
  const tipRows = i => series.map(s => ({k: s.name, v: s.values[i] == null ? "–" : tf(s.values[i]), c: cssVar(s.color)}));
  if (spec.type === "hbar"){
    const rowH = series.length > 1 ? 30 : 22, padL = Math.min(170, Math.max(90, W * .28)), padR = 56, H = cats.length * rowH + 26;
    const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": spec.title || "chart"}, null);
    const vals = series.flatMap(s => s.values).filter(v => v != null && isFinite(v));
    const sc = scaleOf(vals), max = sc.hi, min = sc.lo;
    const x = v => padL + (v - min) / (max - min) * (W - padL - padR);
    for (const v of sc.ticks){ const xx = x(v);
      el("line", {x1: xx, x2: xx, y1: 0, y2: H - 20, class: "gl"}, svg);
      const tx = el("text", {x: xx, y: H - 6, "text-anchor": "middle"}, svg); tx.textContent = vf(v); }
    el("line", {x1: x(0), x2: x(0), y1: 0, y2: H - 20, class: "base"}, svg);
    cats.forEach((c, i) => {
      const y0 = i * rowH + 3, bh = (rowH - 8) / series.length;
      if (c.hl) el("rect", {x: 0, y: i * rowH, width: W, height: rowH, class: "sel"}, svg);
      const lab = el("text", {x: padL - 8, y: y0 + (rowH - 6) / 2 + 4, "text-anchor": "end"}, svg);
      lab.textContent = c.label.length > 24 ? c.label.slice(0, 23) + "…" : c.label;
      series.forEach((s, j) => {
        const v = s.values[i]; if (v == null || !isFinite(v)) return;
        const a = x(Math.min(0, v)), b = x(Math.max(0, v));
        el("rect", {x: a, y: y0 + j * bh, width: Math.max(1, b - a), height: Math.max(2, bh - 2), rx: 3, fill: cssVar(s.color)}, svg);
        if (j === 0) { const t = el("text", {x: b + 4, y: y0 + j * bh + bh / 2 + 3}, svg); t.textContent = vf(v); }
      });
      const hit = el("rect", {x: 0, y: i * rowH, width: W, height: rowH, class: "hit"}, svg);
      hit.addEventListener("mousemove", ev => showTip(ev, c.label, tipRows(i)));
      hit.addEventListener("mouseleave", hideTip);
      if (spec.onClick) { hit.style.cursor = "pointer"; hit.addEventListener("click", () => spec.onClick(c)); }
    });
    host.appendChild(svg); return;
  }
  const H = spec.height || 240, padL = 52, padR = 10, padT = 10, padB = 26;
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": spec.title || "chart"}, null);
  let vals;
  if (spec.type === "stack") vals = cats.map((_, i) => series.reduce((a, s) => a + Math.max(0, s.values[i] || 0), 0));
  else vals = series.flatMap(s => s.values).filter(v => v != null && isFinite(v));
  const sc = scaleOf(vals), hi = sc.hi, lo = sc.lo;
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const bw = (W - padL - padR) / cats.length, cx = i => padL + bw * i + bw / 2;
  cats.forEach((c, i) => { if (c.hl) el("rect", {x: padL + bw * i, y: padT, width: bw, height: H - padT - padB, class: "sel"}, svg); });
  for (const v of sc.ticks){
    el("line", {x1: padL, x2: W - padR, y1: y(v), y2: y(v), class: "gl"}, svg);
    const tx = el("text", {x: padL - 6, y: y(v) + 4, "text-anchor": "end"}, svg); tx.textContent = vf(v); }
  el("line", {x1: padL, x2: W - padR, y1: y(Math.max(lo, 0)), y2: y(Math.max(lo, 0)), class: "base"}, svg);
  const every = Math.ceil(cats.length / Math.max(1, Math.floor((W - padL) / 46)));
  cats.forEach((c, i) => { if (i % every) return; const t = el("text", {x: cx(i), y: H - 8, "text-anchor": "middle"}, svg); t.textContent = c.label; });
  if (spec.type === "vbar"){
    const inner = Math.min(46, bw * .78), sw = inner / series.length;
    cats.forEach((c, i) => series.forEach((s, j) => {
      const v = s.values[i]; if (v == null || !isFinite(v)) return;
      const x0 = cx(i) - inner / 2 + j * sw;
      el("rect", {x: x0 + 1, y: Math.min(y(v), y(0)), width: Math.max(1, sw - 2), height: Math.max(1, Math.abs(y(v) - y(0))), rx: 3,
        fill: cssVar(s.color), opacity: s.faded && s.faded[i] ? .45 : 1}, svg);
    }));
  } else if (spec.type === "stack"){
    const inner = Math.min(40, bw * .7);
    cats.forEach((c, i) => { let acc = 0;
      series.forEach(s => { const v = Math.max(0, s.values[i] || 0); if (!v) return;
        el("rect", {x: cx(i) - inner / 2, y: y(acc + v), width: inner, height: Math.max(1, y(acc) - y(acc + v) - 2), rx: 2, fill: cssVar(s.color)}, svg);
        acc += v; }); });
  } else {
    series.forEach(s => {
      let d = "", pen = false;
      s.values.forEach((v, i) => { if (v == null || !isFinite(v)) { pen = false; return; } d += (pen ? "L" : "M") + cx(i) + "," + y(v); pen = true; });
      el("path", {d, fill: "none", stroke: cssVar(s.color), "stroke-width": 2, "stroke-dasharray": s.dash ? "5 4" : ""}, svg);
      s.values.forEach((v, i) => { if (v == null || !isFinite(v)) return;
        const hollow = s.hollow && s.hollow[i];
        el("circle", {cx: cx(i), cy: y(v), r: 4, fill: hollow ? cssVar("--card") : cssVar(s.color), stroke: cssVar(s.color), "stroke-width": 2}, svg); });
    });
  }
  cats.forEach((c, i) => {
    const hit = el("rect", {x: padL + bw * i, y: padT, width: bw, height: H - padT - padB, class: "hit"}, svg);
    const rows = tipRows(i);
    if (spec.type === "stack") rows.push({k: "Total", v: tf(series.reduce((a, s) => a + (s.values[i] || 0), 0))});
    if (c.note) rows.push({k: c.note, v: ""});
    hit.addEventListener("mousemove", ev => showTip(ev, c.title || c.label, rows));
    hit.addEventListener("mouseleave", hideTip);
    if (spec.onClick) { hit.style.cursor = "pointer"; hit.addEventListener("click", () => spec.onClick(c)); }
  });
  host.appendChild(svg);
}

function simAgg(dept, keys){
  const sim = S.fin && S.fin.simphony;
  const out = {locs: [], tot: {net: 0, checks: 0, guests: 0, gross: 0, discounts: 0, days: 0}, cmp: {net: 0, checks: 0, guests: 0, days: 0}, any: false};
  if (!sim || !sim.locations) return out;
  const cks = compKeys(keys, F.compare === "budget" ? "ly" : F.compare).filter(k => !k.includes("~"));
  for (const [ref, l] of Object.entries(sim.locations)){
    if (dept !== "*" && l.dept !== dept) continue;
    const s = {net: 0, checks: 0, guests: 0, gross: 0, discounts: 0, days: 0}, p = {net: 0, checks: 0, guests: 0, days: 0};
    keys.forEach(k => { const m = l.months[k]; if (m) for (const f in s) s[f] += m[f] || 0; });
    cks.forEach(k => { const m = l.months[k]; if (m) for (const f in p) p[f] += m[f] || 0; });
    if (!s.days && !p.days) continue;
    out.locs.push({ref, name: l.name, dept: l.dept, currency: l.currency, s, p});
    if (l.currency === C()) { for (const f in out.tot) out.tot[f] += s[f]; for (const f in out.cmp) out.cmp[f] += p[f]; }
    out.any = true;
  }
  out.locs.sort((a, b) => b.s.net - a.s.net);
  out.partialCmp = cks.length !== keys.length;
  return out;
}

/* purchasing: S.pur.invoices[dept][month][vendor] = [amount, invoices, without PO, amount without PO] */
function purAgg(dept, keys){
  const out = {amt: 0, n: 0, nopo: 0, nopoAmt: 0, vendors: {}, missing: 0};
  if (!S.pur) return out;
  const inv = S.pur.invoices || {};
  const ds = dept === "*" ? Object.keys(inv) : [dept];
  for (const k of keys) { let seen = false;
    for (const d of ds){ const m = inv[d] && inv[d][k]; if (!m) continue; seen = true;
      for (const [v, r] of Object.entries(m)){ out.amt += r[0]; out.n += r[1]; out.nopo += r[2]; out.nopoAmt += r[3];
        const t = out.vendors[v] || (out.vendors[v] = [0, 0, 0, 0]); t[0] += r[0]; t[1] += r[1]; t[2] += r[2]; t[3] += r[3]; } }
    if (!seen) out.missing++; }
  out.nopoRate = out.n ? out.nopo / out.n * 100 : null;
  const list = Object.values(out.vendors).map(v => v[0]).sort((a, b) => b - a);
  out.top5 = out.amt ? list.slice(0, 5).reduce((s, v) => s + v, 0) / out.amt * 100 : null;
  out.vendorCount = list.filter(v => v).length;
  return out;
}
const foreignIn = keys => keys.reduce((s, k) => s + ((S.pur && S.pur.foreign && S.pur.foreign[k]) || 0), 0);

  if (!S.pur) { $("view").innerHTML = `<div class="card"><h2>Purchasing</h2><p class="hint">${esc(S.purErr || "Purchasing figures are not available for your role.")}</p></div>`; return; }

    tile("Purchases invoiced", compact(p.amt), C(), `${fmt(p.amt)} ${C()} excl. VAT` + (foreignIn(keys) ? ` · ${fmt(foreignIn(keys))} in a foreign currency at face value` : ""), dl(delta(p.amt, pc.amt), false, lbl)) +
    tile("Purchases % of revenue", a && a.sales ? pct(p.amt / a.sales * 100) : "–", "", "Invoiced against revenue posted", "") +
    tile("Invoices", fmt(p.n), "", `${fmt(p.vendorCount)} suppliers`, dl(delta(p.n, pc.n), false, lbl)) +
    tile("Without a purchase order", pct(p.nopoRate), "", `${fmt(p.nopo)} invoices · ${compact(p.nopoAmt)} ${C()}`, dl(delta(p.nopoRate, pc.nopoRate, "pts"), false, lbl)) +
    tile("Top 5 suppliers", pct(p.top5), "", "share of purchases", dl(delta(p.top5, pc.top5, "pts"), false, lbl)) + `</div>`;
  h += `<div class="grid2">` + chartCard("chPurMonth", "Purchases by month", `${F.year}, ${esc(deptName(F.dept))}, against last year`) +
       chartCard("chPurPo", "Invoices without a purchase order", `${F.year}, share of invoices by month`) + `</div>`;
  h += `<div class="grid2"><div class="card"><div class="chead"><div><h2>Purchases by restaurant</h2><p class="hint">${esc(periodText(keys))}. Click a row to filter.</p></div></div><div class="scroll" id="tbPurDept"></div></div>
        <div class="card"><div class="chead"><div><h2>Top suppliers</h2><p class="hint">${esc(deptName(F.dept))}, ${esc(periodText(keys))}</p></div></div><div class="scroll" id="tbPurVend"></div></div></div>`;
  $("view").innerHTML = h;
  const ks = yearKeys(), sel = new Set(keys);
  const cats = ks.map(k => ({key: k, label: mshort(k), title: mlabel(k), hl: sel.has(k)}));
  const cur = ks.map(k => purAgg(F.dept, [k])), ly = ks.map(k => purAgg(F.dept, compKeys([k], "ly")));
  drawChart($("chPurMonth"), {type: "vbar", cats, series: [{name: "Actual", color: "--c1", values: cur.map(x => x.missing ? null : x.amt)}, {name: "Last year", color: "--c2", values: ly.map(x => x.missing ? null : x.amt)}],
    onClick: c => { F.end = c.key; $("fEnd").value = c.key; render(); }});
  drawChart($("chPurPo"), {type: "line", cats, fmt: v => fmt(v,0) + "%", tipFmt: v => pct(v),
    series: [{name: "Actual", color: "--c1", values: cur.map(x => x.nopoRate), line: true}, {name: "Last year", color: "--c2", values: ly.map(x => x.nopoRate), dash: true, line: true}]});
  const inv = S.pur.invoices || {};
  const codes = Array.from(new Set(Object.keys(inv)));
  const rows = codes.map(code => { const x = purAgg(code, keys), y = purAgg(code, compKeys(keys, how)), r = finOK() && code ? actual(code, keys) : null;
    return {code, name: code ? deptName(code) : "Not on a restaurant", x, y, r}; }).filter(r => r.x.amt || r.y.amt).sort((u, v) => v.x.amt - u.x.amt);
  $("tbPurDept").innerHTML = `<table><tr><th>Restaurant</th><th class="num">Purchases</th><th class="num">vs ${esc(compName(how))}</th><th class="num">% of revenue</th><th class="num">Invoices</th><th class="num">Without PO</th></tr>` +
    rows.map(r => `<tr class="${r.code ? "click" : ""} ${F.dept === r.code ? "sel" : ""}" data-dept="${esc(r.code)}"><td>${esc(r.name)}</td><td class="num">${fmt(r.x.amt)}</td><td class="num">${dl(delta(r.x.amt, r.y.amt), false)}</td>
      <td class="num">${r.r && r.r.sales ? pct(r.x.amt / r.r.sales * 100) : "–"}</td><td class="num">${fmt(r.x.n)}</td><td class="num">${pct(r.x.nopoRate)}</td></tr>`).join("") + `</table>`;
  const vend = Object.entries(p.vendors).sort((u, v) => v[1][0] - u[1][0]).slice(0, 12);
  $("tbPurVend").innerHTML = !vend.length ? `<div class="empty">No invoices for this selection.</div>` :
    `<table><tr><th>Supplier</th><th class="num">Purchases</th><th class="num">Share</th><th class="num">Invoices</th><th class="num">Without PO</th></tr>` +
    vend.map(([no, v]) => `<tr><td>${esc((S.pur.vendors || {})[no] || no)} <span class="meta">${esc(no)}</span></td><td class="num">${fmt(v[0])}</td><td class="num">${p.amt ? pct(v[0] / p.amt * 100) : "–"}</td>
      <td class="num">${fmt(v[1])}</td><td class="num">${v[2] ? `<span class="dl bad">${fmt(v[2])}</span>` : "0"}</td></tr>`).join("") + `</table>`;
}

const DEF_LABEL = {sales: "Revenue", food: "Food cost", labor: "Labour", prime: "Prime cost", ebitda: "EBITDA", running: "Month in progress", budget: "Budget", simphony: "Simphony"};
const VIEWS = {overview: viewOverview, sales: viewSales, labor: viewLabor, food: viewFood, budget: viewBudget, purchasing: viewPurchasing};
function render(){
  CHARTS.clear(); hideTip();
  syncUrl();
  const keys = rangeKeys();
  const how = F.tab === "budget" ? "budget" : F.tab === "purchasing" && F.compare === "budget" ? "ly" : F.compare;
  $("periodLabel").textContent = keys.length ? `${periodText(keys)} · ${deptName(F.dept)} · against ${compName(how)}` : "Reading…";
  renderBanner();
  const needsFin = F.tab !== "purchasing";
  if (needsFin && !S.fin) { $("view").innerHTML = `<div class="card"><p class="hint" style="margin:0">${esc(S.finErr || "Reading Business Central…")}</p></div>`; return; }
  try { VIEWS[F.tab](); } catch (e) { console.error(e); $("view").innerHTML = `<div class="card"><p class="hint">This view could not be drawn: ${esc(e.message)}</p></div>`; }
  const defs = (S.fin && S.fin.definitions) || {}, pd = (S.pur && S.pur.definitions) || {};

                food: ["food","running"], budget: ["budget","ebitda"], purchasing: []}[F.tab];

    (F.tab === "purchasing" ? Object.values(pd).map(esc).join(" ") : "") + ` Every figure is read-only from Business Central${F.tab === "sales" ? " and Simphony" : ""}; the filters re-cut what is loaded and do not run another report.</div>`;
}
function renderBanner(){
  const f = S.fin, p = S.pur, parts = [];
  let done = 0, total = 0;
  if (f && f.pending) { const g = f.progress || {}; parts.push(`Finance: ${g.stage || "reading"}${g.total ? ` ${fmt(g.done)} of ${fmt(g.total)}` : ""}`); done += g.done || 0; total += g.total || 0; }
  if (p && p.pending) { const g = p.progress || {}; parts.push(`Purchasing: ${fmt(g.done)} of ${fmt(g.total)} months`); done += g.done || 0; total += g.total || 0; }
  const errs = [...((f && f.errors) || []), ...((p && p.errors) || [])];
  let h = "";
  if (parts.length) h += `<div class="banner"><span class="bar"><i style="width:${total ? Math.round(done / total * 100) : 5}%"></i></span><span>${esc(parts.join(" · "))}. The figures fill in as they arrive; the first read of a year takes several minutes, after that it is quick.</span></div>`;
  if (S.finErr && F.tab !== "purchasing") h += `<div class="banner warn">Finance: ${esc(S.finErr)}</div>`;
  if (errs.length) h += `<div class="banner warn"><span>${esc(errs.slice(0, 3).join(" · "))}${errs.length > 3 ? ` · and ${errs.length - 3} more` : ""}</span></div>`;
  $("banner").innerHTML = h;
  const busy = parts.length > 0;
  $("pill").className = "pill" + (busy ? " load" : errs.length || S.finErr || S.purErr ? " err" : "");
  $("pillText").textContent = busy ? "Reading…" : `Live · ${new Date().toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"})}`;
}

function fillEnd(){

  sel.innerHTML = ks.map(k => `<option value="${k}">${mlabel(k)}${run && k === run.month ? " (to date)" : ""}</option>`).join("");
  if (!ks.includes(F.end)) {
    // the last month that has ended is the natural default; the month in progress is one click away
    F.end = ks.length > 1 && run && ks[ks.length - 1] === run.month ? ks[ks.length - 2] : ks[ks.length - 1];
  }
  sel.value = F.end;
}
function fillDepts(){
  const sel = $("fDept"), list = depts();
  const cur = F.dept;
  sel.innerHTML = `<option value="*">Whole company</option>` + list.map(d => `<option value="${esc(d.code)}">${esc(d.name)}${d.name !== d.code ? ` (${esc(d.code)})` : ""}</option>`).join("");

function syncUrl(){
  const q = new URLSearchParams({company: F.company, year: F.year, mode: F.mode, end: F.end, dept: F.dept, compare: F.compare, tab: F.tab});
  history.replaceState(null, "", "/executive?" + q.toString());
}
async function load(refresh){
  clearTimeout(S.timer);
  const co = encodeURIComponent(F.company), yr = F.year, r = refresh ? "&refresh=1" : "";
  const jobs = [];
  if (can("finance.view")) jobs.push(get(`/finance/api/executive?company=${co}&year=${yr}${r}`).then(j => { S.fin = j; S.finErr = null; }).catch(e => { S.finErr = e.message; }));
  else S.finErr = "Your role does not include the Finance tower.";
  if (can("purchasing.view")) jobs.push(get(`/purchasing/api/executive?company=${co}&year=${yr}${r}`).then(j => { S.pur = j; S.purErr = null; }).catch(e => { S.purErr = e.message; }));
  else S.purErr = "Your role does not include the Purchasing tower.";
  await Promise.all(jobs);
  if (S.fin && (S.fin.company !== F.company || S.fin.year !== F.year)) S.fin = null;
  if (S.pur && (S.pur.company !== F.company || S.pur.year !== F.year)) S.pur = null;
  fillEnd(); fillDepts(); render();
  if ((S.fin && S.fin.pending) || (S.pur && S.pur.pending)) S.timer = setTimeout(() => load(false), 5000);
}

  const t = $("towers");
  [["purchasing.view","/purchasing/","Purchasing"],["finance.view","/finance/","Finance"],["finance.inventory.view","/finance/#inventory","Inventory"]]

  F.company = companies.includes(q.get("company")) ? q.get("company") : def;
  F.year = [now, now - 1, now - 2].includes(+q.get("year")) ? +q.get("year") : now;
  if (["month","quarter","ytd"].includes(q.get("mode"))) F.mode = q.get("mode");
