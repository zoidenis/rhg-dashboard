<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/i18n.js"></script><!-- pulse in Albanian or English (identity) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08303f">
<title>RHG Executive Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
button,select,input{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
main{flex:1;min-width:0}
header{display:flex;justify-content:space-between}
.adminlink{margin-top:auto;padding-top:16px}
.adminlink a{color:var(--rhg-blue);font-size:11px;text-decoration:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);display:inline-block}
.pill.err .dot{background:var(--up)} .pill.load .dot{background:var(--warn)}

/* chart tokens: validated two-series pair (actual, comparison) and a four-slot split */
:root{--c1:#1e78a6;--c2:#c47f1f;--c3:#7a5bbf;--c4:#2e9a6e;--grid:#e6e8e9;--axis:#5c7482;--hl:rgba(30,120,166,.07)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--c1:#3a95c6;--c2:#c4832a;--c3:#9479d6;--c4:#3aa87a;--grid:#194354;--axis:#93b2bf;--hl:rgba(58,149,198,.12)}
}
:root[data-theme="dark"]{--c1:#3a95c6;--c2:#c4832a;--c3:#9479d6;--c4:#3aa87a;--grid:#194354;--axis:#93b2bf;--hl:rgba(58,149,198,.12)}

/* the pop-ups (Pulse): the same frame as the towers' */
.pl-bd{position:fixed;inset:0;background:rgba(8,48,63,.45);display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;z-index:60}
.pl-bd.show{display:flex}
.pl-pop{background:var(--bg);border-radius:16px;width:min(1180px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.pl-pop .ph{background:var(--side,#08303f);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pl-pop .ph h2{font-size:20px;color:#fff;margin:0}
.pl-pop .ph .sub{color:#a0d8ea;font-size:12.5px}
.pl-pop .ph .sp{flex:1}
.pl-pop .ph .close{background:transparent;border:1px solid #2b5a6c;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.pl-body{padding:16px 18px 18px}
.pl-body .pz-tile .v small{font-size:12px;font-weight:600;margin-left:3px}
@media (max-width:600px){.pl-bd{padding:0}.pl-pop{border-radius:0;min-height:100%}}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:-8px 0 12px}
.filters label{flex:1 1 150px;padding-left:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;
  color:var(--rhg-primary);background:var(--card);border:1px solid var(--line)}
.tabs button:hover{border-color:var(--rhg-primary)}
.tabs button.on{background:var(--rhg-primary);color:#fff;border-color:var(--rhg-primary)}
@media (prefers-color-scheme: dark){.tabs button{color:var(--ink)}.tabs button.on{background:#1e78a6;border-color:#1e78a6}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:4px}
.dl{font-weight:600;white-space:nowrap}
.dl.good{color:var(--rhg-green)} .dl.bad{color:var(--rhg-red)} .dl.flat{color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid2 > .card{min-width:0}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.card{margin-bottom:16px}
.grid2 .card{margin-bottom:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 12px;flex-wrap:wrap}
.chead > div:first-child{flex:1 1 240px;min-width:0}
.chead h2{font-size:15px}
.chead .hint{margin:4px 0 0}
.tgl{all:unset;cursor:pointer;font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
.tgl:hover{text-decoration:underline}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:10px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:2px;border-radius:1px;vertical-align:3px;width:14px}
.chart{position:relative;width:100%;margin-top:6px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--rhg-font);font-size:11px;fill:var(--axis)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1;opacity:.6}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover,.chart .hit.on{fill:var(--hl)}
.chart .sel{fill:var(--hl)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.12);display:none;min-width:150px}
#tip b{display:block;margin-bottom:2px}
#tip .r{display:flex;justify-content:space-between;gap:14px}
#tip .r span:first-child{color:var(--sub)}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.scroll{overflow-x:auto}
td.num,th.num{font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--rhg-sky)}
tr.sel td{background:var(--rhg-sky)}
td.mut{color:var(--sub)}
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin-bottom:16px;font-size:12px}
.banner .bar{flex:0 0 160px;height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.banner .bar i{display:block;height:100%;background:var(--c1);width:0}
.banner.warn{border-color:var(--rhg-amber)}
.note{font-size:11px;color:var(--sub);line-height:1.5;margin:8px 0 0}
.empty{color:var(--sub);padding:14px 0}
.prov{color:var(--rhg-amber);font-weight:600}
.defs{font-size:11px;color:var(--sub);line-height:1.6}
/* Financial Health: eight cards, the P&L against budget and last year, the balance sheet against the end of the
   month before and of last year */
.fh{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:10px 0 0}
.fh-c{border:1px solid var(--line);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:4px;min-width:0;
  color:inherit;text-decoration:none;background:var(--card)}
a.fh-c:hover{border-color:var(--accent)}
.fh-c .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);font-weight:500}
.fh-c .v{font-family:var(--rhg-font-display);font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fh-c .v small{font-size:12px;font-weight:600;color:var(--sub);margin-left:4px}
.fh-r{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.fh-r b{font-weight:600;color:var(--ink)}
.st{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--rhg-sky);color:var(--ink);white-space:nowrap}
.st.ok{background:var(--rhg-greenbg);color:var(--rhg-green)} .st.cr{background:var(--rhg-amberbg);color:var(--rhg-amber)}
.chg{list-style:none;margin:8px 0 0;padding:0}
.chg li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45}
.chg li:first-child{border-top:0}
.chg .ic{font-weight:700;text-align:center}.chg .ic.good{color:var(--rhg-green)}.chg .ic.bad{color:var(--rhg-red)}
.chg .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.chg a{color:var(--accent);font-weight:600;text-decoration:none;font-size:11.5px}
.wf{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.wf-r{display:grid;grid-template-columns:minmax(100px,170px) 1fr 104px;gap:8px;align-items:center;font-size:12px}
.wf-t{position:relative;height:16px}.wf-t i{position:absolute;top:2px;bottom:2px;border-radius:4px;min-width:2px}
.wf-r .n{text-align:right;font-variant-numeric:tabular-nums}.wf-r.tot{font-weight:700}
.wf-0{position:absolute;top:0;bottom:0;width:1px;background:var(--sub);opacity:.5}
.mbar{display:grid;grid-template-columns:minmax(90px,130px) 1fr 110px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.mbar .tr{height:9px;background:var(--grid);border-radius:5px;overflow:hidden}.mbar .tr i{display:block;height:100%;border-radius:5px;background:var(--c1)}
.mbar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.defs b{color:var(--ink);font-weight:600}
/* phone: the side menu becomes a drawer, opened by the Menu button at the top (Finance, Purchasing, Sales…) */
.mnav-btn,.mnav-bd{display:none}
@media(max-width:760px){
  aside{display:flex;position:fixed;left:0;top:0;bottom:0;z-index:70;height:100vh;height:100dvh;overflow-y:auto;
        transform:translateX(-105%);transition:transform .2s ease}
  body.mnav-open aside{transform:none;box-shadow:0 0 32px rgba(0,0,0,.35)}
  body.mnav-open{overflow:hidden}
  .mnav-bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65}
  body.mnav-open .mnav-bd{display:block}
  .mnav-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);
            border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:8px;align-self:flex-start}
  .mnav-btn svg{width:18px;height:18px}
  main{padding:16px}
}
@media (prefers-reduced-motion: reduce){aside{transition:none}}
@media(max-width:760px){main{padding:16px} header{flex-direction:column} .hdr-side{align-items:flex-start}
  .kpis{grid-template-columns:1fr 1fr}}
</style>

<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo" role="img" aria-label="Revo Hospitality Group"></div><div><b>Revo</b><small>Hospitality Group</small></div></div>
  <div class="towers" aria-label="Control towers" id="towers">
    <span class="lbl">Control towers</span>
    <a href="/">Control center</a>
    <a href="/executive" class="on" aria-current="page">Executive dashboard</a>
  </div>
  <div class="adminlink" id="adminLink"></div>
  <div class="powered">powered by <span class="pulse-mark">pulse</span></div>
</aside>
<div class="mnav-bd no-report" id="mnavBd"></div>

<main>
  <button class="mnav-btn no-report" id="mnavBtn" type="button" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
  <header>
    <div>
      <div class="eyebrow">RHG Control towers / Business Central and Simphony, read-only</div>
      <h1>Executive dashboard</h1>
      <div class="period" id="periodLabel">Reading…</div>
    </div>
    <div class="hdr-side">
      <div class="hdr-btns"><button class="btn dark" id="refreshBtn">Refresh now</button></div>
      <div class="hdr-meta">
        <span class="pill load" id="pill"><span class="dot"></span><span id="pillText">Reading…</span></span>
        <span class="sep">|</span><span id="whoami"></span>
        <button class="linkbtn" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <label>Company <select id="fCompany"></select></label>
    <label>Year <select id="fYear"></select></label>
    <label>Period <select id="fMode">
      <option value="month">Month</option><option value="quarter">Quarter to date</option>
      <option value="ytd">Year to date</option></select></label>
    <label>Up to <select id="fEnd"></select></label>
    <label>Restaurant <select id="fDept"><option value="*">Whole company</option></select></label>
    <label>Compare with <select id="fCompare">
      <option value="ly">Last year</option><option value="budget">Budget</option>
      <option value="prior">Period before</option></select></label>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button data-tab="overview" class="on">Executive KPIs</button>
    <button data-tab="sales">Sales</button>
    <button data-tab="labor">Labour cost</button>
    <button data-tab="food">Food cost</button>
    <button data-tab="budget">Budget</button>
    <button data-tab="balance">Balance &amp; capital</button>
    <button data-tab="purchasing">Purchasing</button>
    <button data-tab="locations" id="tabLocations">Location intelligence</button>
  </div>

  <div id="banner"></div>
  <div id="view"></div>
  <p class="note" id="foot"></p>
</main>
</div>
<div id="tip" role="tooltip"></div>
<script src="/pulse.js"></script><!-- the shared pop-ups, Back and small charts -->
<script src="/locintel.js"></script>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=0) => n == null || !isFinite(n) ? "–" : Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const compact = v => { if (v == null || !isFinite(v)) return "–"; const a = Math.abs(v);
  return a >= 1e9 ? (v/1e9).toFixed(2)+"B" : a >= 1e6 ? (v/1e6).toFixed(1)+"M" : a >= 1e4 ? (v/1e3).toFixed(0)+"K" : fmt(v,0); };
const pct = (v, d=1) => v == null || !isFinite(v) ? "–" : fmt(v, d) + "%";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mlabel = k => { const [y,m] = k.split("-"); return MON[+m-1] + " " + y; };
const mshort = k => MON[+k.split("-")[1]-1];
let me = null, CSRF = null;
const can = p => !!me && (me.permissions||[]).includes(p);
// Screens (Admin → Roles & permissions: a tab each) and access (Admin → Accounts → Access). A person limited to some
// locations of the company gets Location intelligence only: the other tabs show the whole company.
const holds = prefix => !!me && (me.permissions||[]).some(p => p.startsWith(prefix));
function myLocs(co){
  const L = (me && me.scope && me.scope.locations) || {}, k = Object.keys(L).find(x => x.toUpperCase() === String(co||"").toUpperCase());
  return k && Array.isArray(L[k]) && L[k].length ? L[k] : null;
}
const tabOk = t => can("platform.s.executive." + t) && (t === "locations" || !myLocs(F.company));
function paintTabs(){
  const bs = [...document.querySelectorAll("#tabs button[data-tab]")];
  bs.forEach(b => { b.style.display = tabOk(b.dataset.tab) ? "" : "none"; });
  if (!tabOk(F.tab)) { const f = bs.find(b => tabOk(b.dataset.tab)); if (f) F.tab = f.dataset.tab; }
  bs.forEach(x => x.classList.toggle("on", x.dataset.tab === F.tab));
  return bs.some(b => tabOk(b.dataset.tab));
}
function noTabs(){
  const mine = myLocs(F.company);
  $("view").innerHTML = `<div class="card"><p class="hint" style="margin:0">${mine
    ? `Your access covers ${esc(mine.join(", "))} of ${esc(F.company)}, and your role does not hold Location intelligence here. Choose another company, or ask the administrator.`
    : "Your role does not hold any tab of the executive dashboard. Ask the administrator (Administration → Roles &amp; permissions)."}</p></div>`;
  $("banner").innerHTML = ""; $("foot").innerHTML = "";
}

const S = {fin: null, pur: null, finErr: null, purErr: null, timer: null};
const F = {company: "", year: new Date().getFullYear(), mode: "month", end: "", dept: "*", compare: "ly", tab: "overview"};

async function get(path){
  const r = await fetch(path, {credentials: "same-origin"});
  if (r.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  const t = await r.text(); let j = {};
  try { j = JSON.parse(t); } catch (e) {
    throw new Error(r.status === 504 || r.status === 502 ? "The server took too long to answer; it keeps reading, try again in a minute." : "HTTP " + r.status);
  }
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* ------------------------------------------------------------ periods */
const shift = (k, n) => { let [y,m] = k.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  return `${y}-${String(m).padStart(2,"0")}`; };
function rangeKeys(){
  if (!F.end) return [];
  const m = +F.end.split("-")[1];
  const start = F.mode === "ytd" ? 1 : F.mode === "quarter" ? Math.floor((m-1)/3)*3+1 : m;
  const out = []; for (let i = start; i <= m; i++) out.push(`${F.year}-${String(i).padStart(2,"0")}`);
  return out;
}
const running = () => (S.fin && S.fin.running) || null;
function compKeys(keys, how){
  const run = running();
  if (how === "ly") return keys.map(k => run && k === run.month ? run.ly : shift(k, -12));
  if (how === "prior") return keys.map(k => keys.length === 1 && run && k === run.month ? run.prior : shift(k, -keys.length));
  return keys;
}
const compName = how => ({ly: "last year", prior: "the period before", budget: "budget"})[how];
function periodText(keys){
  if (!keys.length) return "";
  const run = running(); const last = keys[keys.length-1];
  const tail = run && last === run.month ? ` (to ${new Date(run.to+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})})` : "";
  return keys.length === 1 ? mlabel(keys[0]) + tail : `${mshort(keys[0])} – ${mlabel(last)}${tail}`;
}

/* ------------------------------------------------------------ figures */
const BUCKETS = ["sales","other_income","food","labor_kitchen","labor_service","labor_management","labor_other","opex","da","below"];
function bucketOf(no){
  const a = S.fin && S.fin.accounts[no];
  return a ? a[1] : (String(no).startsWith("7") ? "other_income" : "opex");
}
function derive(t){
  t.labor = t.labor_kitchen + t.labor_service + t.labor_management + t.labor_other;
  t.prime = t.food + t.labor;
  t.ebitda = t.sales + t.other_income - t.food - t.labor - t.opex;
  t.ebit = t.ebitda - t.da; t.net = t.ebit - t.below;
  const r = v => t.sales ? v / t.sales * 100 : null;
  t.foodPct = r(t.food); t.laborPct = r(t.labor); t.primePct = r(t.prime); t.ebitdaPct = r(t.ebitda); t.opexPct = r(t.opex);
  return t;
}
function blank(){ const t = {acc: {}, n: 0, missing: 0}; BUCKETS.forEach(b => t[b] = 0); return t; }
/* sum of cells: src[dept][key] = {account: value}; scale: optional {key: factor} */
function agg(src, dept, keys, scale){
  const t = blank();
  for (const k of keys){
    const c = src && src[dept] && src[dept][k];
    if (!c) { t.missing++; continue; }
    t.n++; const f = scale && scale[k] != null ? scale[k] : 1;
    for (const no in c){ const v = c[no] * f; t[bucketOf(no)] += v; t.acc[no] = (t.acc[no]||0) + v; }
  }
  return derive(t);
}
function budgetScale(keys){
  const run = running(), sc = {};
  if (run && keys.includes(run.month)){
    const [y,m] = run.month.split("-").map(Number), days = new Date(y, m, 0).getDate();
    sc[run.month] = (new Date(run.to+"T00:00:00").getDate()) / days;
  }
  return sc;
}
function actual(dept, keys){ return agg(S.fin && S.fin.actual, dept, keys); }
function comparison(dept, keys, how){
  how = how || F.compare;
  if (how === "budget") return S.fin && S.fin.budget && S.fin.budget.available ? agg(S.fin.budget.cells, dept, keys, budgetScale(keys)) : null;
  return agg(S.fin && S.fin.actual, dept, compKeys(keys, how));
}
function unassigned(keys, src, scale){
  const all = agg(src, "*", keys, scale), t = blank();
  BUCKETS.forEach(b => t[b] = all[b]);
  for (const d of depts()) { const x = agg(src, d.code, keys, scale); BUCKETS.forEach(b => t[b] -= x[b]); }
  t.n = all.n; return derive(t);
}
const depts = () => (S.fin && S.fin.departments) || [];
const deptName = c => c === "*" ? "Whole company" : c === "" ? "Not on a restaurant" : ((depts().find(d => d.code === c) || {}).name || c);

/* change against comparison; for costs and ratios a rise is bad */
function delta(cur, cmp, kind){
  if (cur == null || cmp == null || !isFinite(cur) || !isFinite(cmp)) return null;
  if (kind === "pts") { const d = cur - cmp; return {v: d, txt: (d >= 0 ? "+" : "") + fmt(d,1) + " pts"}; }
  if (!cmp) return null;
  const d = (cur - cmp) / Math.abs(cmp) * 100; return {v: d, txt: (d >= 0 ? "+" : "") + fmt(d,1) + "%"};
}
function dl(d, goodWhenUp, label){
  if (!d) return label ? `<span class="dl flat">no comparison</span>` : `<span class="mut">–</span>`;
  const flat = Math.abs(d.v) < 0.05, good = flat ? null : (d.v > 0) === goodWhenUp;
  const cls = flat ? "flat" : good ? "good" : "bad", arrow = flat ? "→" : d.v > 0 ? "▲" : "▼";
  return `<span class="dl ${cls}" title="${good === null ? "Unchanged" : good ? "Better" : "Worse"}">${arrow} ${esc(d.txt)}</span>${label ? ` <span class="meta">${esc(label)}</span>` : ""}`;
}
function tile(label, value, unit, sub, dlt){
  return `<div class="card kpi"><div class="l">${esc(label)}</div><div class="v">${value}${unit ? `<small>${esc(unit)}</small>` : ""}</div>
    <div class="s">${dlt || ""}${sub ? `<div class="meta">${sub}</div>` : ""}</div></div>`;
}

const tip = $("tip");

}
const hideTip = () => { tip.style.display = "none"; };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceStep(v){ if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  return {lo, hi, ticks};
}
function legendHTML(series){
  if (series.length < 2) return "";

}
/* spec: {type:"vbar"|"hbar"|"line"|"stack", cats:[{key,label,hl}], series:[{name,color,values,line}], fmt, tipFmt, onClick} */
const CHARTS = new Map();
function drawChart(host, spec){
  CHARTS.set(host.id, spec);
  if (host.dataset.table === "1") return drawTable(host, spec);
  const W = Math.max(280, host.clientWidth || 600);
  const vf = spec.fmt || compact, tf = spec.tipFmt || (v => fmt(v,0));
  host.innerHTML = legendHTML(spec.series);
  const cats = spec.cats, series = spec.series;
  if (!cats.length) { host.insertAdjacentHTML("beforeend", `<div class="empty">Nothing to show for this selection.</div>`); return; }
  const tipRows = i => series.map(s => ({k: s.name, v: s.values[i] == null ? "–" : tf(s.values[i]), c: cssVar(s.color)}));
  if (spec.type === "hbar"){
    const rowH = series.length > 1 ? 30 : 22, padL = Math.min(170, Math.max(90, W * .28)), padR = 56, H = cats.length * rowH + 26;
    const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": spec.title || "chart"}, null);
    const vals = series.flatMap(s => s.values).filter(v => v != null && isFinite(v));
    const sc = scaleOf(vals), max = sc.hi, min = sc.lo;
    const x = v => padL + (v - min) / (max - min) * (W - padL - padR);
    for (const v of sc.ticks){ const xx = x(v);
      el("line", {x1: xx, x2: xx, y1: 0, y2: H - 20, class: "gl"}, svg);
      const tx = el("text", {x: xx, y: H - 6, "text-anchor": "middle"}, svg); tx.textContent = vf(v); }
    el("line", {x1: x(0), x2: x(0), y1: 0, y2: H - 20, class: "base"}, svg);
    cats.forEach((c, i) => {
      const y0 = i * rowH + 3, bh = (rowH - 8) / series.length;
      if (c.hl) el("rect", {x: 0, y: i * rowH, width: W, height: rowH, class: "sel"}, svg);
      const lab = el("text", {x: padL - 8, y: y0 + (rowH - 6) / 2 + 4, "text-anchor": "end"}, svg);
      lab.textContent = c.label.length > 24 ? c.label.slice(0, 23) + "…" : c.label;
      series.forEach((s, j) => {
        const v = s.values[i]; if (v == null || !isFinite(v)) return;
        const a = x(Math.min(0, v)), b = x(Math.max(0, v));
        el("rect", {x: a, y: y0 + j * bh, width: Math.max(1, b - a), height: Math.max(2, bh - 2), rx: 3, fill: cssVar(s.color)}, svg);
        if (j === 0) { const t = el("text", {x: b + 4, y: y0 + j * bh + bh / 2 + 3}, svg); t.textContent = vf(v); }
      });
      const hit = el("rect", {x: 0, y: i * rowH, width: W, height: rowH, class: "hit"}, svg);
      hit.addEventListener("mousemove", ev => showTip(ev, c.label, tipRows(i)));
      hit.addEventListener("mouseleave", hideTip);
      if (spec.onClick) { hit.style.cursor = "pointer"; hit.addEventListener("click", () => spec.onClick(c)); }
    });
    host.appendChild(svg); return;
  }
  const H = spec.height || 240, padL = 52, padR = 10, padT = 10, padB = 26;
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": spec.title || "chart"}, null);
  let vals;
  if (spec.type === "stack") vals = cats.map((_, i) => series.reduce((a, s) => a + Math.max(0, s.values[i] || 0), 0));
  else vals = series.flatMap(s => s.values).filter(v => v != null && isFinite(v));
  const sc = scaleOf(vals), hi = sc.hi, lo = sc.lo;
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const bw = (W - padL - padR) / cats.length, cx = i => padL + bw * i + bw / 2;
  cats.forEach((c, i) => { if (c.hl) el("rect", {x: padL + bw * i, y: padT, width: bw, height: H - padT - padB, class: "sel"}, svg); });
  for (const v of sc.ticks){
    el("line", {x1: padL, x2: W - padR, y1: y(v), y2: y(v), class: "gl"}, svg);
    const tx = el("text", {x: padL - 6, y: y(v) + 4, "text-anchor": "end"}, svg); tx.textContent = vf(v); }
  el("line", {x1: padL, x2: W - padR, y1: y(Math.max(lo, 0)), y2: y(Math.max(lo, 0)), class: "base"}, svg);
  const every = Math.ceil(cats.length / Math.max(1, Math.floor((W - padL) / 46)));
  cats.forEach((c, i) => { if (i % every) return; const t = el("text", {x: cx(i), y: H - 8, "text-anchor": "middle"}, svg); t.textContent = c.label; });
  if (spec.type === "vbar"){
    const inner = Math.min(46, bw * .78), sw = inner / series.length;
    cats.forEach((c, i) => series.forEach((s, j) => {
      const v = s.values[i]; if (v == null || !isFinite(v)) return;
      const x0 = cx(i) - inner / 2 + j * sw;
      el("rect", {x: x0 + 1, y: Math.min(y(v), y(0)), width: Math.max(1, sw - 2), height: Math.max(1, Math.abs(y(v) - y(0))), rx: 3,
        fill: cssVar(s.color), opacity: s.faded && s.faded[i] ? .45 : 1}, svg);
    }));
  } else if (spec.type === "stack"){
    const inner = Math.min(40, bw * .7);
    cats.forEach((c, i) => { let acc = 0;
      series.forEach(s => { const v = Math.max(0, s.values[i] || 0); if (!v) return;
        el("rect", {x: cx(i) - inner / 2, y: y(acc + v), width: inner, height: Math.max(1, y(acc) - y(acc + v) - 2), rx: 2, fill: cssVar(s.color)}, svg);
        acc += v; }); });
  } else {
    series.forEach(s => {
      let d = "", pen = false;
      s.values.forEach((v, i) => { if (v == null || !isFinite(v)) { pen = false; return; } d += (pen ? "L" : "M") + cx(i) + "," + y(v); pen = true; });
      el("path", {d, fill: "none", stroke: cssVar(s.color), "stroke-width": 2, "stroke-dasharray": s.dash ? "5 4" : ""}, svg);
      s.values.forEach((v, i) => { if (v == null || !isFinite(v)) return;
        const hollow = s.hollow && s.hollow[i];
        el("circle", {cx: cx(i), cy: y(v), r: 4, fill: hollow ? cssVar("--card") : cssVar(s.color), stroke: cssVar(s.color), "stroke-width": 2}, svg); });
    });
  }
  cats.forEach((c, i) => {
    const hit = el("rect", {x: padL + bw * i, y: padT, width: bw, height: H - padT - padB, class: "hit"}, svg);
    const rows = tipRows(i);
    if (spec.type === "stack") rows.push({k: "Total", v: tf(series.reduce((a, s) => a + (s.values[i] || 0), 0))});
    if (c.note) rows.push({k: c.note, v: ""});
    hit.addEventListener("mousemove", ev => showTip(ev, c.title || c.label, rows));
    hit.addEventListener("mouseleave", hideTip);
    if (spec.onClick) { hit.style.cursor = "pointer"; hit.addEventListener("click", () => spec.onClick(c)); }
  });
  host.appendChild(svg);
}
function drawTable(host, spec){

    spec.cats.map((c, i) => `<tr><td>${esc(c.title || c.label)}</td>${spec.series.map(s => `<td class="num">${s.values[i] == null ? "–" : esc(tf(s.values[i]))}</td>`).join("")}</tr>`).join("") +

const C = () => (S.fin && S.fin.currency) || (S.pur && S.pur.currency) || "ALL";

function monthlySeries(metric, how){
  /* the year's months, actual against the comparison chosen (prior falls back to last year: month by month) */
  const ks = yearKeys(), sel = new Set(rangeKeys());
  const h = how === "prior" ? "ly" : how;
  const cur = ks.map(k => metric(actual(F.dept, [k]))), cmpv = ks.map(k => { const c = comparison(F.dept, [k], h); return c ? metric(c) : null; });
  const prov = new Set((S.fin && S.fin.provisional) || []), run = running();
  const cats = ks.map(k => ({key: k, label: mshort(k), title: mlabel(k) + (run && k === run.month ? ` to ${run.to.slice(8)}` : ""), hl: sel.has(k),

function simAgg(dept, keys){
  const sim = S.fin && S.fin.simphony;
  const out = {locs: [], tot: {net: 0, checks: 0, guests: 0, gross: 0, discounts: 0, days: 0}, cmp: {net: 0, checks: 0, guests: 0, days: 0}, any: false};
  if (!sim || !sim.locations) return out;
  const cks = compKeys(keys, F.compare === "budget" ? "ly" : F.compare).filter(k => !k.includes("~"));
  for (const [ref, l] of Object.entries(sim.locations)){
    if (dept !== "*" && l.dept !== dept) continue;
    const s = {net: 0, checks: 0, guests: 0, gross: 0, discounts: 0, days: 0}, p = {net: 0, checks: 0, guests: 0, days: 0};
    keys.forEach(k => { const m = l.months[k]; if (m) for (const f in s) s[f] += m[f] || 0; });
    cks.forEach(k => { const m = l.months[k]; if (m) for (const f in p) p[f] += m[f] || 0; });
    if (!s.days && !p.days) continue;
    out.locs.push({ref, name: l.name, dept: l.dept, currency: l.currency, s, p});
    if (l.currency === C()) { for (const f in out.tot) out.tot[f] += s[f]; for (const f in out.cmp) out.cmp[f] += p[f]; }
    out.any = true;
  }
  out.locs.sort((a, b) => b.s.net - a.s.net);
  out.partialCmp = cks.length !== keys.length;
  return out;
}

function simHint(){
  const sim = S.fin && S.fin.simphony;
  if (!sim || !sim.configured) return "Simphony is not connected (Finance → Settings → Simphony sales).";
  if (sim.error) return "Simphony: " + sim.error;
  if (F.dept !== "*" && !sim.tied) return "Simphony locations are not tied to restaurants yet: fill in 'Simphony location → BC code' in Finance → Settings.";
  return S.fin.pending ? "Simphony days are still being read." : "No Simphony sales for this selection.";
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

function accountTable(a, c, buckets, income){
  const nos = Object.keys(Object.assign({}, a.acc, c ? c.acc : {})).filter(no => buckets.includes(bucketOf(no)));
  const rows = nos.map(no => ({no, name: (S.fin.accounts[no] || [""])[0], v: a.acc[no] || 0, p: c ? (c.acc[no] || 0) : null}))
    .filter(r => Math.abs(r.v) >= 0.5 || Math.abs(r.p || 0) >= 0.5).sort((x, y) => Math.abs(y.v) - Math.abs(x.v));
  if (!rows.length) return `<div class="empty">No postings on these accounts for this selection.</div>`;
  const tot = rows.reduce((s, r) => s + r.v, 0), totp = c ? rows.reduce((s, r) => s + (r.p || 0), 0) : null;
  return `<table><tr><th>Account</th><th class="num">Amount</th><th class="num">% of revenue</th><th class="num">${esc(cap(compName(F.compare)))}</th><th class="num">Change</th></tr>` +
    rows.map(r => `<tr class="click" data-pulse="exacc|${esc(r.no)}" tabindex="0"><td>${esc(r.no)} <span class="mut">${esc(r.name)}</span></td><td class="num">${fmt(r.v)}</td><td class="num">${a.sales ? pct(r.v / a.sales * 100) : "–"}</td>
      <td class="num">${r.p == null ? "–" : fmt(r.p)}</td><td class="num">${dl(delta(r.v, r.p), income)}</td></tr>`).join("") +
    `<tr class="total"><td>Total</td><td class="num">${fmt(tot)}</td><td class="num">${a.sales ? pct(tot / a.sales * 100) : "–"}</td><td class="num">${totp == null ? "–" : fmt(totp)}</td><td class="num">${dl(delta(tot, totp), income)}</td></tr></table>`;
}

/* ------------------------------------------------------------ Financial Health (one KPI library)
   The P&L lines come from the KPI mapping of the Finance tower (each account carries its line), so the
   statement here is the one of Finance → Financial statements. The balance sheet, liquidity and payables
   are read from the Finance tower (/finance/api/capital) for the legal entity at the end of the "Up to"
   month: a balance sheet is never cut by restaurant. */
const PL_ROWS = [["revenue","Net revenue",1],["other_income","Other operating income",1],["cogs","Cost of goods sold",-1],
  ["gross","Gross profit",0],["labour","Labour",-1],["occupancy","Occupancy",-1],["opex","Other operating expenses",-1],
  ["ebitda","EBITDA",0],["da","Depreciation and amortization",-1],["ebit","EBIT",0],["finance","Interest and finance costs (net)",-1],
  ["nonop","Non-operating items",-1],["tax","Income tax",-1],["unmapped","Accounts not in the mapping",-1],["net","Net profit",0]];
const PL_LINE_KEYS = ["revenue","other_income","cogs","labour","occupancy","opex","da","finance","nonop","tax"];
function plLines(t){
  if (!t) return null;
  const v = {unmapped: 0}; PL_LINE_KEYS.forEach(k => v[k] = 0);
  for (const no in t.acc){
    const a = S.fin && S.fin.accounts[no], line = a && a[2];
    v[line && PL_LINE_KEYS.includes(line) ? line : "unmapped"] += t.acc[no];
  }
  v.gross = v.revenue - v.cogs;
  v.ebitda = v.revenue + v.other_income - v.cogs - v.labour - v.occupancy - v.opex;
  v.ebit = v.ebitda - v.da;
  v.net = v.ebit - v.finance - v.nonop - v.tax - v.unmapped;      // = − Σ every income-statement account
  v.n = t.n; v.missing = t.missing;
  return v;
}
const hasBudget = () => !!(S.fin && S.fin.budget && S.fin.budget.available);
const plOf = (keys, how) => { const t = how === "actual" ? actual(F.dept, keys) : comparison(F.dept, keys, how); return t && t.n ? plLines(t) : null; };
const kpiSt = () => (S.fin && S.fin.kpi_status) || "Content required";
const stChip = s => `<span class="st ${s === "Approved" ? "ok" : s === "Pilot" ? "" : "cr"}">${esc(s || "Content required")}</span>`;
const lastDay = k => { const run = running(); if (run && k === run.month) return run.to; const [y, m] = k.split("-").map(Number); return `${k}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`; };
/* the same screen in the Finance tower, with the filters of this page */
function finHref(view, legal){
  if (!holds("finance.s.")) return "";
  const keys = rangeKeys(); if (!keys.length) return "";
  const q = new URLSearchParams({company: F.company});
  const first = keys[0], last = keys[keys.length - 1];
  if (legal || keys.length === 1) { q.set("mode", "month"); q.set("period", (legal ? last : first) + "-01"); }
  else { q.set("mode", "range"); q.set("period", `${first}-01..${lastDay(last)}`); }
  if (!legal && F.dept && F.dept !== "*") q.set("dimension", F.dept);
  return `/finance/?${q.toString()}#${view}`;
}
/* the balance sheet, liquidity and payables of the legal entity at the end of the "Up to" month */
S.cap = null; S.capKey = ""; S.capErr = null; S.capBusy = false;
const capWanted = () => `${F.company}|${F.end}`;
async function loadCap(){
  if (!can("finance.view") || !F.end || S.capBusy) return;
  const key = capWanted();
  if (S.capKey === key && (S.cap || S.capErr)) return;
  S.capBusy = true; S.capKey = key; S.cap = null; S.capErr = null;
  try {
    const j = await get(`/finance/api/capital?company=${encodeURIComponent(F.company)}&period=${F.end}-01&mode=month`);
    if (capWanted() === key) { if (j.available === false) S.capErr = j.error || "The balance sheet could not be read."; else S.cap = j; }
  } catch (e) { if (capWanted() === key) S.capErr = e.message; }
  finally { S.capBusy = false; }
  if (capWanted() === key && ["overview", "balance"].includes(F.tab)) render();
  else if (capWanted() !== key && ["overview", "balance"].includes(F.tab)) loadCap();
}
const dmy = d => d ? `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(0, 4)}` : "–";
const capK = key => S.cap && (S.cap.liquidity || []).find(x => x.key === key);
function capWait(){
  if (!can("finance.view")) return "Your role does not include the Finance tower.";
  return S.capErr ? "Balance sheet: " + S.capErr : "Reading the balance sheet from Business Central…";
}
function neutral(d){ return d ? `<span class="dl flat">${d.v > 0 ? "▲" : d.v < 0 ? "▼" : "→"} ${esc(d.txt)}</span>` : `<span class="mut">–</span>`; }
const amtDelta = (a, b) => a == null || b == null ? null : {v: a - b, txt: (a - b >= 0 ? "+" : "−") + compact(Math.abs(a - b))};
function fhCard(label, value, unit, rows, status, href){
  const body = `<div class="top"><span>${esc(label)}</span>${stChip(status)}</div><div class="v">${value}${unit ? `<small>${esc(unit)}</small>` : ""}</div>` +
    rows.map(r => `<div class="fh-r"><span>${esc(r[0])} <b>${r[1]}</b></span><span>${r[2] || ""}</span></div>`).join("");
  return href ? `<a class="fh-c" href="${esc(href)}">${body}</a>` : `<div class="fh-c">${body}</div>`;
}
function financialHealth(keys){
  const L = plOf(keys, "actual"), B = hasBudget() ? plOf(keys, "budget") : null, Y = plOf(keys, "ly");
  const st = kpiSt(), plHref = finHref("pl"), cr = st === "Content required";
  const pctOf = (x, k) => x && x.revenue > 0 ? x[k] / x.revenue * 100 : null;
  const prime = x => x && x.revenue > 0 ? (x.cogs + x.labour) / x.revenue * 100 : null;
  const plCard = (label, get, money, up, sub) => {
    const v = L && !cr ? get(L) : null, b = B && !cr ? get(B) : null, y = Y && !cr ? get(Y) : null;
    const d = (c) => money ? delta(v, c) : delta(v, c, "pts");
    return fhCard(label, cr ? "–" : money ? compact(v) : pct(v), money && !cr ? C() : "",
      [...(sub && !cr ? [[sub, "", ""]] : []),
       ["Budget", b == null ? "–" : money ? compact(b) : pct(b), b == null ? (hasBudget() ? "" : `<span class="mut">no budget</span>`) : dl(d(b), up)],
       ["Last year", y == null ? "–" : money ? compact(y) : pct(y), y == null ? "" : dl(d(y), up)]], st, plHref);
  };
  let h = plCard("Net revenue", x => x.revenue, true, true) +
    plCard("EBITDA", x => x.ebitda, true, true, L && L.revenue > 0 ? `${pct(pctOf(L, "ebitda"))} of revenue` : "") +
    plCard("Net profit", x => x.net, true, true, L && L.revenue > 0 ? `${pct(pctOf(L, "net"))} of revenue` : "") +
    plCard("Prime cost %", prime, false, false, L && L.revenue > 0 ? `COGS ${pct(pctOf(L, "cogs"))} · labour ${pct(pctOf(L, "labour"))}` : "");
  const D = S.cap && S.cap.dates, lqHref = finHref("liquidity", true);
  const bsCard = (key, label, up) => {
    const k = capK(key);
    if (!k) return fhCard(label, "–", "", [[capWait(), "", ""]], S.capErr ? "Content required" : "Pilot", "");
    const md = amtDelta(k.value, k.month_end), yd = amtDelta(k.value, k.year_end);
    const mark = d => d == null ? "" : up == null ? neutral(d) : dl({v: d.v, txt: d.txt}, up);
    return fhCard(label, k.value == null ? "–" : compact(k.value), k.value == null ? "" : C(),

/* the three to five changes and risks that weigh most, in money */
function changesBlock(keys, L){

      const rel = Cm[k] ? ` (${d >= 0 ? "+" : ""}${fmt(d / Math.abs(Cm[k]) * 100, 1)}%)` : "";
      items.push({eff, label, title: `${d >= 0 ? "up" : "down"} ${compact(Math.abs(d))} ${C()} against ${compName(how)}`, rel,

    if (n && n.value != null && n.month_end != null && Math.abs(n.value - n.month_end) >= 1)
      items.push({eff: -(n.value - n.month_end), label: "Net debt", title: `${n.value >= n.month_end ? "up" : "down"} ${compact(Math.abs(n.value - n.month_end))} ${C()} since ${dmy(D.month_end)}`,
        text: [`Balance at ${dmy(D.current)}: ${compact(n.value)} ${C()}`], href: finHref("liquidity", true)});

      <span class="amt ${x.eff >= 0 ? "dl good" : "dl bad"}">${x.eff >= 0 ? "+" : "−"}${compact(Math.abs(x.eff))}</span></li>`).join("")}</ul>`;

/* from the net profit of the comparison to the actual one, line by line */
function waterfallHTML(L, Cm, cmpLabel){

  const steps = [{label: `Net profit, ${cmpLabel}`, a: 0, b: Cm.net, total: true}];
  let run = Cm.net;

    if (!sg) continue;
    const d = sg * ((L[k] || 0) - (Cm[k] || 0));

    steps.push({label, a: run, b: run + d, gap: k === "unmapped"}); run += d;
  }
  steps.push({label: "Net profit, actual", a: 0, b: L.net, total: true});
  const vals = steps.flatMap(s => [s.a, s.b]), lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = hi - lo || 1, x = v => (v - lo) / span * 100;
  return `<div class="wf">` + steps.map(s => {
    const a = Math.min(s.a, s.b), b = Math.max(s.a, s.b), d = s.b - s.a;
    const col = s.total ? "var(--data-cur)" : s.gap ? "var(--rhg-amber)" : d >= 0 ? "var(--rhg-green)" : "var(--rhg-red)";
    return `<div class="wf-r ${s.total ? "tot" : ""}" title="${esc(s.label)}: ${s.total ? fmt(s.b) : (d >= 0 ? "+" : "") + fmt(d)}"><div>${esc(s.label)}</div>
      <div class="wf-t"><span class="wf-0" style="left:${x(0)}%"></span><i style="left:${x(a)}%;width:${Math.max(0.4, x(b) - x(a))}%;background:${col}"></i></div>
      <div class="n ${s.total ? "" : d >= 0 ? "dl good" : "dl bad"}">${s.total ? compact(s.b) : (d >= 0 ? "+" : "−") + compact(Math.abs(d))}</div></div>`;
  }).join("") + `</div>`;
}

/* purchasing: S.pur.invoices[dept][month][vendor] = [amount, invoices, without PO, amount without PO] */
function purAgg(dept, keys){
  const out = {amt: 0, n: 0, nopo: 0, nopoAmt: 0, vendors: {}, missing: 0};
  if (!S.pur) return out;
  const inv = S.pur.invoices || {};
  const ds = dept === "*" ? Object.keys(inv) : [dept];
  for (const k of keys) { let seen = false;
    for (const d of ds){ const m = inv[d] && inv[d][k]; if (!m) continue; seen = true;
      for (const [v, r] of Object.entries(m)){ out.amt += r[0]; out.n += r[1]; out.nopo += r[2]; out.nopoAmt += r[3];
        const t = out.vendors[v] || (out.vendors[v] = [0, 0, 0, 0]); t[0] += r[0]; t[1] += r[1]; t[2] += r[2]; t[3] += r[3]; } }
    if (!seen) out.missing++; }
  out.nopoRate = out.n ? out.nopo / out.n * 100 : null;
  const list = Object.values(out.vendors).map(v => v[0]).sort((a, b) => b - a);
  out.top5 = out.amt ? list.slice(0, 5).reduce((s, v) => s + v, 0) / out.amt * 100 : null;
  out.vendorCount = list.filter(v => v).length;
  return out;
}

const DEF_LABEL = {sales: "Revenue", food: "Food cost", labor: "Labour", prime: "Prime cost", ebitda: "EBITDA", running: "Month in progress", budget: "Budget", simphony: "Simphony"};

/* Location intelligence: every restaurant of the company from Simphony and Business Central, read by the
   Finance tower (/finance/api/locations) and drawn by the shared module locintel.js. It follows the
   Company and "Up to" filters (month to date of that month); the other filters do not apply. */
function liMonth(){
  if (F.end) return F.end;
  const d = new Date();
  return F.year === d.getFullYear() ? `${F.year}-${String(d.getMonth() + 1).padStart(2, "0")}` : `${F.year}-12`;
}
/* The P&L of each restaurant from Business Central (the department cube this page already holds), for
   the latest month whose payroll and food cost are posted: the month in progress has neither until the
   month-end closing, so its food cost and EBITDA would mislead. */
function liFinance(){
  if (!S.fin || S.fin.pending || !S.fin.actual || S.fin.company !== F.company) return null;
  const want = liMonth(), ks = (S.fin.months || []).filter(k => k <= want), run = running();
  const posted = k => { const t = actual("*", [k]); return t.n && t.sales > 0 && t.food > 0 && t.labor > 0; };
  let month = null;
  for (let i = ks.length - 1; i >= 0; i--) {
    const k = ks[i];
    if (run && k === run.month) continue;
    if (!posted(k)) continue;
    const prev = ks.slice(Math.max(0, i - 3), i).map(x => actual("*", [x]).labor).filter(v => v > 0);
    const avg = prev.length ? prev.reduce((a, v) => a + v, 0) / prev.length : 0;
    if (avg && actual("*", [k]).labor < 0.5 * avg) continue;      // payroll only partly posted
    month = k; break;
  }
  if (!month) return null;
  const ytd = (S.fin.months || []).filter(k => k.slice(0, 4) === month.slice(0, 4) && k <= month);
  // the lines of the KPI library (the same as Finance → P&L): occupancy apart, gross margin = revenue − COGS. For a
  // restaurant "ebitda" is its result before central costs (Partial); Contribution once the allocation is approved
  const pick = t => { if (!t) return t; const L = plLines(t), r = t.sales ? v => v / t.sales * 100 : () => null;
    return {sales: t.sales, other_income: t.other_income, food: t.food, labor: t.labor, opex: t.opex, da: t.da,
      prime: t.prime, ebitda: t.ebitda, foodPct: t.foodPct, laborPct: t.laborPct, primePct: t.primePct, opexPct: t.opexPct, ebitdaPct: t.ebitdaPct, n: t.n,
      occupancy: L.occupancy, occupancyPct: r(L.occupancy), gross: t.sales - t.food, grossPct: r(t.sales - t.food), central: null, contribution: null, contributionPct: null}; };
  const codes = new Set(depts().map(d => d.code));
  const R = S.fin.allocation || {}, rest = new Set((S.fin.restaurants || []).map(x => String(x).toUpperCase()));
  const restCodes = depts().map(d => d.code).filter(c => rest.has(String(c).toUpperCase()));
  // central costs over the restaurants: pool = company EBITDA − Σ restaurants' results before central costs
  const allocate = ks => {
    const co = actual("*", ks), dir = {}, rev = {};
    restCodes.forEach(c => { const t = actual(c, ks); if (t.n) { dir[c] = t.ebitda; rev[c] = t.sales; } });
    const pool = co.ebitda - Object.values(dir).reduce((a, v) => a + v, 0), sh = {};
    if (R.method === "fixed") Object.entries(R.shares || {}).forEach(([k, v]) => sh[k] = v / 100);
    else { const tot = Object.values(rev).filter(v => v > 0).reduce((a, v) => a + v, 0); Object.entries(rev).forEach(([k, v]) => sh[String(k).toUpperCase()] = tot && v > 0 ? v / tot : 0); }
    const out = {}; Object.keys(dir).forEach(c => { const a = pool * (sh[String(c).toUpperCase()] || 0); out[c] = {central: a, contribution: R.approved ? dir[c] + a : null}; });
    return {pool, out};
  };
  const Am = allocate([month]), Ay = allocate(ytd);
  const withAlloc = (t, A, dept) => { if (!t || !A.out[dept]) return t; const x = A.out[dept];
    return Object.assign(t, {central: x.central, contribution: x.contribution, contributionPct: x.contribution != null && t.sales ? x.contribution / t.sales * 100 : null}); };
  return {company: F.company, month, label: mlabel(month), ytdLabel: `${mshort(ytd[0])}–${mlabel(month)}`, wanted: want,
    provisional: (S.fin.provisional || []).includes(month), budget: !!(S.fin.budget && S.fin.budget.available), currency: S.fin.currency,
    allocation: R, restaurants: rest, pool: Am.pool,
    has: dept => codes.has(dept),
    get: dept => ({cur: withAlloc(pick(actual(dept, [month])), Am, dept), ly: pick(comparison(dept, [month], "ly")), bud: pick(comparison(dept, [month], "budget")),
                   ytd: withAlloc(pick(actual(dept, ytd)), Ay, dept), ytdLy: pick(comparison(dept, ytd, "ly"))}),
    total: () => ({cur: pick(actual("*", [month])), ly: pick(comparison("*", [month], "ly"))})};
}

        text: `<b>${fmt(r.x[0])}</b> <span class="meta">${fmt(r.x[1])} invoices</span>`, open: r.code ? `exdept|${r.code}` : null})), null, {none: "None."})); }
    el.innerHTML = h;
  }});
}
Pulse.on("exdept", exDeptPop); Pulse.on("exmonth", exMonthPop); Pulse.on("exacc", exAccPop); Pulse.on("exvend", exVendPop);
document.addEventListener("click", e => {
  const d = e.target.closest("[data-exdept]"), m = e.target.closest("[data-exmonth]");
  if (d) { exClose(); pickDept(d.dataset.exdept); }
  else if (m) { exClose(); F.end = m.dataset.exmonth; $("fEnd").value = F.end; render(); }
});

function render(){
  CHARTS.clear(); hideTip();
  if (!paintTabs()) { noTabs(); return; }
  syncUrl();
  const keys = rangeKeys();
  const how = F.tab === "budget" ? "budget" : F.tab === "purchasing" && F.compare === "budget" ? "ly" : F.compare;
  $("periodLabel").textContent = keys.length ? `${periodText(keys)} · ${deptName(F.dept)} · against ${compName(how)}` : "Reading…";
  renderBanner();
  if (F.tab === "locations") {
    $("banner").innerHTML = "";
    viewLocations();
    $("foot").innerHTML = `<div class="defs">Location intelligence follows the Company and “Up to” filters: the month to date of that month, whole days, against the same days of the month before and the same dates last year. Period, Restaurant and Compare with do not apply here. The restaurant list and the alert limits are in Finance → Settings → Location intelligence. Every figure is read-only from Simphony and Business Central.</div>`;
    return;
  }
  const needsFin = F.tab !== "purchasing";
  if (needsFin && !S.fin) { $("view").innerHTML = `<div class="card"><p class="hint" style="margin:0">${esc(S.finErr || "Reading Business Central…")}</p></div>`; return; }
  try { VIEWS[F.tab](); } catch (e) { console.error(e); $("view").innerHTML = `<div class="card"><p class="hint">This view could not be drawn: ${esc(e.message)}</p></div>`; }
  const defs = (S.fin && S.fin.definitions) || {}, pd = (S.pur && S.pur.definitions) || {};
  const show = {overview: ["sales","food","labor","prime","ebitda","running"], sales: ["sales","simphony","running"], labor: ["labor","running"],
                food: ["food","running"], budget: ["budget","ebitda"], balance: [], purchasing: []}[F.tab];
  $("foot").innerHTML = `<div class="defs">` + show.filter(k => defs[k]).map(k => `<b>${esc(DEF_LABEL[k] || cap(k))}.</b> ${esc(defs[k])}`).join(" ") +
    (F.tab === "purchasing" ? Object.values(pd).map(esc).join(" ") : "") + ` Every figure is read-only from Business Central${F.tab === "sales" ? " and Simphony" : ""}; the filters re-cut what is loaded and do not run another report.</div>`;
}
function renderBanner(){
  const f = S.fin, p = S.pur, parts = [];
  let done = 0, total = 0;
  if (f && f.pending) { const g = f.progress || {}; parts.push(`Finance: ${g.stage || "reading"}${g.total ? ` ${fmt(g.done)} of ${fmt(g.total)}` : ""}`); done += g.done || 0; total += g.total || 0; }
  if (p && p.pending) { const g = p.progress || {}; parts.push(`Purchasing: ${fmt(g.done)} of ${fmt(g.total)} months`); done += g.done || 0; total += g.total || 0; }
  const errs = [...((f && f.errors) || []), ...((p && p.errors) || [])];
  let h = "";
  if (parts.length) h += `<div class="banner"><span class="bar"><i style="width:${total ? Math.round(done / total * 100) : 5}%"></i></span><span>${esc(parts.join(" · "))}. The figures fill in as they arrive; the first read of a year takes several minutes, after that it is quick.</span></div>`;
  if (S.finErr && F.tab !== "purchasing") h += `<div class="banner warn">Finance: ${esc(S.finErr)}</div>`;
  const ks = f && f.kpi_status, mp = (f && f.mapping) || {};
  if (ks && ks !== "Approved" && F.tab !== "purchasing" && F.tab !== "locations")
    h += `<div class="banner warn"><span>${ks === "Content required" ? `Content required: ${esc(F.company)} has no KPI account mapping, so revenue, costs and EBITDA cannot be shown reliably (Finance → Settings → KPI mapping).`
      : `KPI status: Pilot. The account mapping of ${esc(F.company)} is ${esc(mp.status || "Proposed")}, not yet approved by Finance; these figures are not the official report.`}${(mp.unmapped || []).length ? ` ${mp.unmapped.length} accounts are not mapped.` : ""}</span></div>`;
  if (errs.length) h += `<div class="banner warn"><span>${esc(errs.slice(0, 3).join(" · "))}${errs.length > 3 ? ` · and ${errs.length - 3} more` : ""}</span></div>`;
  $("banner").innerHTML = h;
  const busy = parts.length > 0;
  $("pill").className = "pill" + (busy ? " load" : errs.length || S.finErr || S.purErr ? " err" : "");
  $("pillText").textContent = busy ? "Reading…" : `LIVE · updated ${new Date().toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"})}`;
}
document.addEventListener("click", e => {
  const tr = e.target.closest("tr[data-dept]"); if (!tr || !tr.classList.contains("click")) return;
  exDeptPop(tr.dataset.dept);

/* ------------------------------------------------------------ filters and loading */
function fillEnd(){
  const ks = yearKeys(), sel = $("fEnd"), run = running();
  if (!ks.length) { sel.innerHTML = ""; return; }
  sel.innerHTML = ks.map(k => `<option value="${k}">${mlabel(k)}${run && k === run.month ? " (to date)" : ""}</option>`).join("");
  if (!ks.includes(F.end)) {
    // the last month that has ended is the natural default; the month in progress is one click away
    F.end = ks.length > 1 && run && ks[ks.length - 1] === run.month ? ks[ks.length - 2] : ks[ks.length - 1];
  }
  sel.value = F.end;
}
function fillDepts(){
  const sel = $("fDept"), list = depts();
  const cur = F.dept;
  sel.innerHTML = `<option value="*">Whole company</option>` + list.map(d => `<option value="${esc(d.code)}">${esc(d.name)}${d.name !== d.code ? ` (${esc(d.code)})` : ""}</option>`).join("");
  if (cur !== "*" && !list.some(d => d.code === cur) && list.length) F.dept = "*";
  sel.value = F.dept;
}
function syncUrl(){
  const q = new URLSearchParams({company: F.company, year: F.year, mode: F.mode, end: F.end, dept: F.dept, compare: F.compare, tab: F.tab});
  history.replaceState(null, "", "/executive?" + q.toString());
}
async function load(refresh){
  clearTimeout(S.timer);
  const co = encodeURIComponent(F.company), yr = F.year, r = refresh ? "&refresh=1" : "";
  const jobs = [];
  if (myLocs(F.company)) {      // the whole-company figures are not read for a person limited to some locations
    S.fin = S.pur = null; S.finErr = S.purErr = "Your access covers some locations of " + F.company + ".";
    fillEnd(); fillDepts(); render(); return;
  }
  if (can("finance.view")) jobs.push(get(`/finance/api/executive?company=${co}&year=${yr}${r}`).then(j => { S.fin = j; S.finErr = null; }).catch(e => { S.finErr = e.message; }));
  else S.finErr = "Your role does not include the Finance tower.";
  if (can("purchasing.view")) jobs.push(get(`/purchasing/api/executive?company=${co}&year=${yr}${r}`).then(j => { S.pur = j; S.purErr = null; }).catch(e => { S.purErr = e.message; }));
  else S.purErr = "Your role does not include the Purchasing tower.";
  await Promise.all(jobs);
  if (S.fin && (S.fin.company !== F.company || S.fin.year !== F.year)) S.fin = null;
  if (S.pur && (S.pur.company !== F.company || S.pur.year !== F.year)) S.pur = null;
  fillEnd(); fillDepts(); render();
  if ((S.fin && S.fin.pending) || (S.pur && S.pur.pending)) S.timer = setTimeout(() => load(false), 5000);
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (!b) return;
  F.tab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); render(); });
$("fMode").onchange = e => { F.mode = e.target.value; render(); };
$("fEnd").onchange = e => { F.end = e.target.value; render(); };
$("fDept").onchange = e => { F.dept = e.target.value; render(); };
$("fCompare").onchange = e => { F.compare = e.target.value; render(); };
$("fCompany").onchange = e => { F.company = e.target.value; S.fin = S.pur = null; F.dept = "*"; render(); load(false); };
$("fYear").onchange = e => { F.year = +e.target.value; S.fin = S.pur = null; F.end = ""; render(); load(false); };
$("refreshBtn").onclick = () => F.tab === "locations" && window.LocIntel ? LocIntel.refresh() : load(true);
$("logoutBtn").onclick = async () => {
  try { await fetch("/api/logout", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRF-Token": CSRF || ""}, body: "{}"}); } catch (e) {}
  location.href = "/login?signedout=1";
};

(async () => {
  let s;
  try { s = await get("/api/session"); } catch (e) { location.href = "/login"; return; }
  if (!s.user || s.user.must_change) { location.href = "/login"; return; }
  me = s.user; CSRF = s.user.csrf;
  if (!can("finance.view")) $("tabLocations").style.display = "none";
  $("whoami").textContent = `${me.name || me.username} · ${me.role}`;
  const t = $("towers");
  if (!holds("platform.s.control")) { const cc = t.querySelector('a[href="/"]'); if (cc) cc.remove(); }
  [["purchasing.s.","/purchasing/","Purchasing"],["finance.s.","/finance/","Finance"],["finance.s.inventory.","/finance/#inventory","Inventory"],["finance.s.sales.","/finance/#sales","Sales"]]
    .filter(([p]) => holds(p)).forEach(([, h, l]) => t.insertAdjacentHTML("beforeend", `<a href="${h}">${l}</a>`));
  if (can("unicorn.use")) {   // Unicorn, the business analyst, with the count of unread morning briefs

      if (u.unread) $("uniLink").insertAdjacentHTML("beforeend", `<span class="uni-dot" title="Unread morning briefs">${u.unread}</span>`);
    }).catch(() => {});
  }
  if (can("admin.users.manage") || can("admin.audit.view")) $("adminLink").innerHTML = `<a href="/admin">Administration · accounts, roles and audit</a>`;
  const q = new URLSearchParams(location.search);
  const now = new Date().getFullYear();
  $("fYear").innerHTML = [now, now - 1, now - 2].map(y => `<option>${y}</option>`).join("");
  let companies = [], def = "SALT";
  try {
    const c = await get(can("finance.view") ? "/finance/api/companies" : "/purchasing/api/companies");
    companies = c.companies || []; def = companies.includes(c.default) ? c.default : companies[0] || def;
  } catch (e) {}
  if (!companies.length) companies = [def];
  $("fCompany").innerHTML = companies.map(x => `<option>${esc(x)}</option>`).join("");
  F.company = companies.includes(q.get("company")) ? q.get("company") : def;
  F.year = [now, now - 1, now - 2].includes(+q.get("year")) ? +q.get("year") : now;
  if (["month","quarter","ytd"].includes(q.get("mode"))) F.mode = q.get("mode");
  if (q.get("end")) F.end = q.get("end");
  if (q.get("dept")) F.dept = q.get("dept");
  if (["ly","budget","prior"].includes(q.get("compare"))) F.compare = q.get("compare");
  if (VIEWS[q.get("tab")]) F.tab = q.get("tab");
  $("fCompany").value = F.company; $("fYear").value = F.year; $("fMode").value = F.mode; $("fCompare").value = F.compare;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === F.tab));
  render();
  load(false);
})();
